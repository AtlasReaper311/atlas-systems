name: Apply System SYMPHONY follow-up

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-system-symphony-followup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-and-validate:
    name: Patch and validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/system-symphony-cache-transition-coherence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out patch branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/system-symphony-cache-transition-coherence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Apply focused follow-up patch
        run: python3 scripts/apply_system_symphony_followup.py

      - name: Correct generated cache regex escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("static/js/sonify/coherence-cache.test.js")
          text = path.read_text(encoding="utf-8")
          text = text.replace(r"`ui\.js\?v=", r"`ui\\.js\\?v=")
          text = text.replace(r"`engine\.js\?v=", r"`engine\\.js\\?v=")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate static site and System SYMPHONY
        run: |
          set +e
          {
            echo "== html-validate =="
            npx --yes html-validate@9.7.1 "**/*.html"
            status=$?
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            echo "== node tests =="
            node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
            status=$?
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            echo "== sitemap =="
            python3 scripts/generate_sitemap.py --check-only
            status=$?
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            echo "== pages output =="
            python3 scripts/verify_pages_output.py .
            status=$?
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            echo "== diff check =="
            git diff --check
          } > validation.log 2>&1
          status=$?
          cat validation.log
          exit "$status"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-symphony-followup-validation
          path: validation.log
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-shot patch machinery
        run: |
          set -euo pipefail
          git rm .github/workflows/system-symphony-followup-patcher.yml
          git rm scripts/apply_system_symphony_followup.py

      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/preview.yml _headers lab/index.html static/js/sonify/engine.js static/js/sonify/samples.js static/js/sonify/ui.js static/js/sonify/coherence-cache.test.js
          git diff --cached --check
          git commit -m "fix: smooth System SYMPHONY transitions and cache refresh"
          git push origin HEAD:fix/system-symphony-cache-transition-coherence

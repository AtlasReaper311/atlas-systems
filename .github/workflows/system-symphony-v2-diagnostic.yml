name: System SYMPHONY v2 diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  candidate-tests:
    name: Candidate regression isolation
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'fix/system-symphony-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Prepare v2 candidate
        run: |
          set -euo pipefail
          python3 scripts/run_system_symphony_loop_production_v2.py

      - name: composition-director.test.js
        if: always()
        run: test ! -f static/js/sonify/composition-director.test.js || node --test static/js/sonify/composition-director.test.js

      - name: composition-integration.test.js
        if: always()
        run: test ! -f static/js/sonify/composition-integration.test.js || node --test static/js/sonify/composition-integration.test.js

      - name: coherence-cache.test.js
        if: always()
        run: test ! -f static/js/sonify/coherence-cache.test.js || node --test static/js/sonify/coherence-cache.test.js

      - name: engine.test.js
        if: always()
        run: test ! -f static/js/sonify/engine.test.js || node --test static/js/sonify/engine.test.js

      - name: ghost-circuit.test.js
        if: always()
        run: test ! -f static/js/sonify/ghost-circuit.test.js || node --test static/js/sonify/ghost-circuit.test.js

      - name: mapping.test.js
        if: always()
        run: test ! -f static/js/sonify/mapping.test.js || node --test static/js/sonify/mapping.test.js

      - name: modulation.test.js
        if: always()
        run: test ! -f static/js/sonify/modulation.test.js || node --test static/js/sonify/modulation.test.js

      - name: performance.test.js
        if: always()
        run: test ! -f static/js/sonify/performance.test.js || node --test static/js/sonify/performance.test.js

      - name: poller.test.js
        if: always()
        run: test ! -f static/js/sonify/poller.test.js || node --test static/js/sonify/poller.test.js

      - name: sampler.test.js
        if: always()
        run: test ! -f static/js/sonify/sampler.test.js || node --test static/js/sonify/sampler.test.js

      - name: samples.test.js
        if: always()
        run: test ! -f static/js/sonify/samples.test.js || node --test static/js/sonify/samples.test.js

      - name: seed-dimensions.test.js
        if: always()
        run: test ! -f static/js/sonify/seed-dimensions.test.js || node --test static/js/sonify/seed-dimensions.test.js

      - name: loop-production-v2.test.js
        if: always()
        run: test ! -f static/js/sonify/loop-production-v2.test.js || node --test static/js/sonify/loop-production-v2.test.js

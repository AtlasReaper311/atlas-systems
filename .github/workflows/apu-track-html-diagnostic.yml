name: Atlas APU track HTML diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apu-track-html-diagnostic.yml"
      - "lab/system-symphony-apu/index.html"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-apu-track-html-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: startsWith(github.event.pull_request.head.ref, 'feat/system-symphony-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Capture validator output
        id: validate
        shell: bash
        run: |
          set +e
          npx --yes html-validate@9.7.1 lab/system-symphony-apu/index.html >"${RUNNER_TEMP}/apu-track-html.txt" 2>&1
          status=$?
          echo "status=${status}" >>"${GITHUB_OUTPUT}"
          exit 0

      - name: Upload validator report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: atlas-apu-track-html-diagnostic
          path: ${{ runner.temp }}/apu-track-html.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce validator result
        if: steps.validate.outputs.status != '0'
        run: exit 1

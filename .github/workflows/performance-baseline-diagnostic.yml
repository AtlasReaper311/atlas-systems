name: Performance baseline diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/performance-baseline-diagnostic.yml"
      - "lab/index.html"
      - "data/performance-baseline.json"

permissions:
  contents: read

jobs:
  report:
    name: Report generated static baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Generate exact candidate
        run: |
          set -euo pipefail
          mkdir source
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${HEAD_SHA}" \
            --output source.tgz
          tar -xzf source.tgz --strip-components=1 -C source
          cd source
          python3 scripts/measure_static_performance.py
          cat data/performance-baseline.json

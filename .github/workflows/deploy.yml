name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-sitemap:
    name: Normalize metadata and regenerate sitemap.xml
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      source_changed: ${{ steps.commit.outputs.source_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          # generate_sitemap.py reads each file's real lastmod via
          # `git log`; a shallow clone would collapse every file to the
          # same single commit date.
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: "3.12"

      - name: Normalize source page titles
        run: python3 scripts/normalize_page_titles.py

      - name: Generate sitemap.xml
        run: python3 scripts/generate_sitemap.py

      - name: Commit generated source if it changed
        id: commit
        run: |
          set -euo pipefail
          git add -- '*.html' sitemap.xml
          if git diff --cached --quiet; then
            echo "Generated source unchanged, nothing to commit"
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize page titles and regenerate sitemap.xml [skip ci]"
          git push
          echo "source_changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [generate-sitemap, verify-pages-output]
    if: needs.generate-sitemap.outputs.source_changed != 'true'
    uses: AtlasReaper311/atlas-infra/.github/workflows/validate-static.yml@093df3f87fa4e068155455f82c9b69bffad76fb6 # atlas-infra main
    with:
      project_name: atlas-systems
      site_label: atlas-systems.uk
      inject_build_meta: true
    secrets: inherit

  verify-pages-output:
    name: Verify Pages output contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24

      - name: Confirm 404 and routing contract
        run: python3 scripts/verify_pages_output.py .

  refresh-corpus:
    needs: [generate-sitemap]
    if: needs.generate-sitemap.outputs.source_changed != 'true'
    uses: AtlasReaper311/atlas-corpus/.github/workflows/refresh-corpus.yml@410a0ba16c8461b191edbed257d0271d76bd8369 # atlas-corpus main
    secrets:
      CORPUS_SECRET: ${{ secrets.CORPUS_SECRET }}

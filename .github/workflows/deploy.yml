name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-sitemap:
    name: Regenerate sitemap.xml
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # generate_sitemap.py reads each file's real lastmod via
          # `git log`; a shallow clone (the default) would collapse
          # every file to the same single commit date.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Generate sitemap.xml
        run: python3 scripts/generate_sitemap.py

      - name: Commit sitemap.xml if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Regenerate sitemap.xml [skip ci]"
          git push

  deploy:
    needs: [generate-sitemap, verify-pages-output]
    uses: AtlasReaper311/atlas-infra/.github/workflows/validate-static.yml@main
    with:
      project_name: atlas-systems
      site_label: atlas-systems.uk
      inject_build_meta: true
    secrets: inherit

  verify-pages-output:
    name: Verify Pages output contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Confirm 404 and routing contract
        run: python3 scripts/verify_pages_output.py .

  refresh-corpus:
    uses: AtlasReaper311/atlas-corpus/.github/workflows/refresh-corpus.yml@main
    secrets:
      CORPUS_SECRET: ${{ secrets.CORPUS_SECRET }}

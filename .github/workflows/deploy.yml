name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-pages-output:
    name: Verify Pages output contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"

      - name: Confirm normalized page titles are committed
        run: |
          set -euo pipefail
          python3 scripts/normalize_page_titles.py
          git diff --exit-code -- '*.html'

      - name: Confirm sitemap is current
        run: python3 scripts/generate_sitemap.py --check-only

      - name: Confirm 404 and routing contract
        run: python3 scripts/verify_pages_output.py .

      - name: Confirm filtered Pages artifact
        run: |
          set -euo pipefail
          publish_directory="${RUNNER_TEMP}/pages-publish"
          bash scripts/prepare_pages_publish.sh "${publish_directory}"
          python3 scripts/verify_pages_output.py "${publish_directory}"

  deploy:
    needs: [verify-pages-output]
    uses: AtlasReaper311/atlas-infra/.github/workflows/validate-static.yml@ba99bab755d5601204ead565a6b308d60a5c53ad # atlas-infra Pages artifact boundary with pinned Wrangler
    with:
      project_name: atlas-systems
      site_label: atlas-systems.uk
      inject_build_meta: true
      publish_exclude_file: .pagesignore
    secrets: inherit

  verify-production:
    name: Verify production custom domain
    needs: [deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirm the custom domain serves this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://atlas-systems.uk
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            URL="${SITE_URL}/?atlas-deploy=${EXPECTED_SHA}&attempt=${attempt}"
            BODY="$(curl -fsSL \
              --connect-timeout 10 \
              --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "$URL" || true)"

            if printf '%s' "$BODY" | grep -Fq "<meta name=\"build-commit\" content=\"${EXPECTED_SHA}\">"; then
              echo "Custom domain is serving ${EXPECTED_SHA}"
              exit 0
            fi

            echo "Attempt ${attempt}/30: custom domain has not exposed ${EXPECTED_SHA} yet"
            sleep 10
          done

          echo "::error::atlas-systems.uk did not expose build-commit=${EXPECTED_SHA} within five minutes"
          exit 1

      - name: Confirm the v2 Systems route is live
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SYSTEMS_BODY="$(curl -fsSL \
            --connect-timeout 10 \
            --max-time 20 \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "https://atlas-systems.uk/systems/?atlas-deploy=${EXPECTED_SHA}")"

          if [[ "$SYSTEMS_BODY" != *'<meta name="atlas-route" content="systems-index">'* ]]; then
            echo "::error::The production Systems route did not expose the expected Systems route marker"
            exit 1
          fi

      - name: Confirm Phase 6 footer assets are live
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://atlas-systems.uk
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            JS_URL="${SITE_URL}/static/js/phase-6-footer.js?atlas-deploy=${EXPECTED_SHA}&attempt=${attempt}"
            CSS_URL="${SITE_URL}/static/css/phase-6-footer.css?atlas-deploy=${EXPECTED_SHA}&attempt=${attempt}"
            JS_BODY="$(curl -fsSL \
              --connect-timeout 10 \
              --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "$JS_URL" || true)"
            CSS_BODY="$(curl -fsSL \
              --connect-timeout 10 \
              --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "$CSS_URL" || true)"

            if printf '%s' "$JS_BODY" | grep -Fq 'const FOOTER_STYLESHEET' \
              && printf '%s' "$CSS_BODY" | grep -Fq 'atlas-interface-kit v0.4.0'; then
              echo "Phase 6 footer assets are live for ${EXPECTED_SHA}"
              exit 0
            fi

            echo "Attempt ${attempt}/30: Phase 6 footer assets are not consistently live yet"
            sleep 10
          done

          echo "::error::Phase 6 footer assets did not become live within five minutes"
          exit 1

      - name: Check out production smoke tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Set up Node.js for production smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"

      - name: Install pinned production browser tooling
        run: npm install --no-save --ignore-scripts playwright@1.61.1

      - name: Install Chromium for production smoke
        run: npx playwright install --with-deps chromium

      - name: Verify the live homepage AtlasField renderer
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://atlas-systems.uk
          HOMEPAGE_FIELD_OUTPUT_DIR: ${{ runner.temp }}/homepage-atlas-field-production-smoke
        run: node scripts/smoke_homepage_atlas_field_production.mjs

      - name: Upload production homepage AtlasField evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: homepage-atlas-field-production-smoke
          path: ${{ runner.temp }}/homepage-atlas-field-production-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Verify the live System Symphony Atlas APU and topology map
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://atlas-systems.uk
          SYMPHONY_PRODUCTION_OUTPUT_DIR: ${{ runner.temp }}/system-symphony-production-smoke
        run: node scripts/smoke_system_symphony_production.mjs

      - name: Upload production System Symphony evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: system-symphony-production-smoke
          path: ${{ runner.temp }}/system-symphony-production-smoke
          if-no-files-found: error
          retention-days: 14

  refresh-corpus:
    needs: [deploy, verify-production]
    if: needs.deploy.result == 'success' && needs.verify-production.result == 'success'
    uses: AtlasReaper311/atlas-corpus/.github/workflows/refresh-corpus.yml@410a0ba16c8461b191edbed257d0271d76bd8369 # atlas-corpus main
    secrets:
      CORPUS_SECRET: ${{ secrets.CORPUS_SECRET }}

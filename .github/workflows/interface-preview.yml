name: Public interface preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".github/workflows/interface-preview.yml"
      - "_headers"
      - "404.html"
      - "index.html"
      - "work/**"
      - "writing/**"
      - "about/**"
      - "systems/**"
      - "css/home-v2-base.css"
      - "css/home-v2-components.css"
      - "css/home-v2-responsive.css"
      - "css/card-search.css"
      - "static/css/estate-shell.css"
      - "static/css/article-interface-v2.css"
      - "static/css/card-signatures.css"
      - "static/css/editorial-surfaces-v2.css"
      - "static/css/v2-directory-pages.css"
      - "static/css/system-symphony.css"
      - "static/css/systems-focus.css"
      - "static/media/card-signatures.svg"
      - "static/vendor/atlas-interface/**"
      - "static/js/homepage-interactions.js"
      - "static/js/card-signatures.js"
      - "static/js/estate-shell.js"
      - "static/js/estate-status.js"
      - "static/js/focused-systems-shell.js"
      - "static/js/sonify/**"
      - "js/card-search.js"
      - "js/tests/homepage-field.test.mjs"
      - "static/js/estate-search/**"
      - "lab/index.html"
      - "lab/console/**"
      - "lab/system-map/**"
      - "lab/system-symphony/**"
      - "lab/shared/**"
      - "lab/proof-chain/**"
      - "lab/signal/**"
      - "lab/anomaly/**"
      - "lab/conformance/**"
      - "lab/reliability/**"
      - "lab/speculum/**"
      - "lab/tests/speculum*.test.mjs"
      - "data/performance-baseline.json"
      - "og/**"
      - "scripts/og/**"
      - "js/tests/batch-h-*.test.mjs"
      - "js/tests/card-signatures.test.mjs"
      - "js/tests/public-interface-contract.test.mjs"
      - "scripts/capture_interface_evidence.mjs"
      - "scripts/capture_batch_h_evidence.mjs"
      - "scripts/capture_speculum_evidence.mjs"
      - "scripts/generate_sitemap.py"
      - "scripts/verify_interface_bundle.py"
      - "sitemap.xml"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-public-interface-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate interface preview candidate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Validate site and interface contracts
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 "**/*.html"
          node --check scripts/capture_interface_evidence.mjs
          node --check scripts/capture_batch_h_evidence.mjs
          node --check scripts/capture_speculum_evidence.mjs
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          python3 scripts/verify_interface_bundle.py
          python3 scripts/generate_sitemap.py --check-only
          python3 scripts/verify_pages_output.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path(".").rglob("*.json")):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          PY
          git diff --check
      - name: Check repository links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments --root-dir ${{ github.workspace }} ."
          format: detailed
          output: interface-link-report.txt
          fail: true
      - name: Upload interface link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: interface-link-report
          path: interface-link-report.txt
          if-no-files-found: warn
          retention-days: 7

  deploy-preview:
    name: Publish non-production interface preview
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'interface-preview-approved')
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: public-interface-preview
      url: ${{ steps.preview.outputs.preview_url }}
    outputs:
      preview_url: ${{ steps.preview.outputs.preview_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PROJECT_NAME: atlas-systems
      PAGES_BRANCH: interface-pr-${{ github.event.pull_request.number }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out interface site branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Guard production boundary
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${SOURCE_BRANCH}" != "main"
          test "${SOURCE_BRANCH}" != "production"
          test "${PAGES_BRANCH}" != "main"
          test "${PAGES_BRANCH}" != "production"
      - name: Prepare filtered Pages publish artifact
        run: bash scripts/prepare_pages_publish.sh "${RUNNER_TEMP}/pages-publish"
      - name: Publish branch preview
        id: deploy
        env:
          PUBLISH_DIRECTORY: ${{ runner.temp }}/pages-publish
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/wrangler-pages-deploy.log"
          npx --yes wrangler@4.113.0 pages deploy "${PUBLISH_DIRECTORY}" --project-name "${PROJECT_NAME}" --branch "${PAGES_BRANCH}" --commit-dirty=true 2>&1 | tee "${output_file}"
          atomic_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "${output_file}" | tail -n 1)"
          test -n "${atomic_url}"
          echo "atomic_url=${atomic_url}" >> "${GITHUB_OUTPUT}"
      - name: Resolve stable preview URL
        id: preview
        env:
          PREVIEW_URL: https://interface-pr-${{ github.event.pull_request.number }}.atlas-systems-44t.pages.dev
        run: |
          set -euo pipefail
          echo "preview_url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          printf '## Public interface preview\n\n%s\n\nAtomic deployment: %s\n\nProduction is unchanged.\n' "${PREVIEW_URL}" "${{ steps.deploy.outputs.atomic_url }}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Attach preview to draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ATOMIC_URL: ${{ steps.deploy.outputs.atomic_url }}
        run: |
          set -euo pipefail
          marker="<!-- atlas-public-interface-preview -->"
          body="${marker}
          ## Live interface preview

          - Estate preview: ${PREVIEW_URL}
          - Atomic deployment: ${ATOMIC_URL}
          - Commit: \`${{ github.event.pull_request.head.sha }}\`
          - Production: unchanged

          Generated article previews remain a separate scheduler-authorised evidence path."
          existing_id="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="${body}"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi

  capture-evidence:
    name: Capture deterministic interface evidence
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out evidence runners
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            scripts/capture_interface_evidence.mjs
            scripts/capture_batch_h_evidence.mjs
            scripts/capture_speculum_evidence.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Install pinned browser and accessibility tooling
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/interface-evidence"
          cp scripts/capture_interface_evidence.mjs "${RUNNER_TEMP}/interface-evidence/"
          cp scripts/capture_batch_h_evidence.mjs "${RUNNER_TEMP}/interface-evidence/"
          cp scripts/capture_speculum_evidence.mjs "${RUNNER_TEMP}/interface-evidence/"
          cd "${RUNNER_TEMP}/interface-evidence"
          npm init -y >/dev/null
          npm install --save-exact playwright@1.61.1 @axe-core/playwright@4.12.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium firefox
      - name: Capture governed browser and viewport matrix
        working-directory: ${{ runner.temp }}/interface-evidence
        run: node capture_interface_evidence.mjs
      - name: Capture Batch H browser and viewport matrix
        working-directory: ${{ runner.temp }}/interface-evidence
        run: node capture_batch_h_evidence.mjs
      - name: Capture Speculum stateful viewport matrix
        working-directory: ${{ runner.temp }}/interface-evidence
        run: node capture_speculum_evidence.mjs
      - name: Upload visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: public-interface-preview-evidence
          path: |
            ${{ runner.temp }}/interface-evidence/evidence.json
            ${{ runner.temp }}/interface-evidence/capture-error.txt
            ${{ runner.temp }}/interface-evidence/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Batch H visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: batch-h-preview-evidence
          path: |
            ${{ runner.temp }}/interface-evidence/batch-h-evidence.json
            ${{ runner.temp }}/interface-evidence/batch-h-capture-error.txt
            ${{ runner.temp }}/interface-evidence/batch-h-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Speculum visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: speculum-preview-evidence
          path: |
            ${{ runner.temp }}/interface-evidence/speculum-evidence.json
            ${{ runner.temp }}/interface-evidence/speculum-capture-error.txt
            ${{ runner.temp }}/interface-evidence/speculum-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

name: Public interface preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".github/workflows/interface-preview.yml"
      - "_headers"
      - "404.html"
      - "index.html"
      - "work/**"
      - "writing/**"
      - "about/**"
      - "systems/**"
      - "lab/**"
      - "css/**"
      - "static/css/**"
      - "static/js/**"
      - "static/media/**"
      - "static/vendor/atlas-interface/**"
      - "js/card-search.js"
      - "js/tests/*.test.mjs"
      - "data/performance-baseline.json"
      - "og/**"
      - "scripts/capture_interface_evidence.mjs"
      - "scripts/capture_batch_h_evidence.mjs"
      - "scripts/interface-evidence/**"
      - "scripts/plan_interface_evidence.mjs"
      - "scripts/smoke_system_map_card_field_preview.mjs"
      - "scripts/smoke_directory_header_fields_preview.mjs"
      - "scripts/generate_sitemap.py"
      - "scripts/verify_interface_bundle.py"
      - "sitemap.xml"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-public-interface-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate interface preview candidate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      evidence_required: ${{ steps.plan.outputs.evidence_required }}
      visual_change: ${{ steps.plan.outputs.visual_change }}
      evidence_contract_change: ${{ steps.plan.outputs.evidence_contract_change }}
      changed_routes_json: ${{ steps.plan.outputs.changed_routes_json }}
      route_count: ${{ steps.plan.outputs.route_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Plan route-derived browser evidence
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/interface-changed-files.txt"
          node scripts/plan_interface_evidence.mjs \
            --sitemap sitemap.xml \
            --changed-files "${RUNNER_TEMP}/interface-changed-files.txt" \
            --output "${RUNNER_TEMP}/interface-evidence-plan.json" \
            --github-output "${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/interface-evidence-plan.json"
      - name: Validate site and interface contracts
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 "**/*.html"
          node --check scripts/capture_interface_evidence.mjs
          node --check scripts/capture_batch_h_evidence.mjs
          node --check scripts/interface-evidence/contract.mjs
          node --check scripts/interface-evidence/browser-core.mjs
          node --check scripts/plan_interface_evidence.mjs
          node --check scripts/smoke_system_map_card_field_preview.mjs
          node --check scripts/smoke_directory_header_fields_preview.mjs
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          python3 scripts/verify_interface_bundle.py
          python3 scripts/generate_sitemap.py --check-only
          python3 scripts/measure_static_performance.py --check-only
          python3 scripts/verify_pages_output.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path(".").rglob("*.json")):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          PY
          git diff --check
      - name: Check repository links offline
        run: python3 scripts/check_repository_links.py . --output interface-link-report.txt
      - name: Upload interface validation records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: interface-validation-${{ github.event.pull_request.head.sha }}
          path: |
            interface-link-report.txt
            ${{ runner.temp }}/interface-evidence-plan.json
            ${{ runner.temp }}/interface-changed-files.txt
          if-no-files-found: warn
          retention-days: 14

  approval-gate:
    name: Require approved browser evidence
    needs: validate
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVIDENCE_REQUIRED: ${{ needs.validate.outputs.evidence_required }}
      APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'interface-preview-approved') }}
      ROUTE_COUNT: ${{ needs.validate.outputs.route_count }}
    steps:
      - name: Enforce evidence approval
        run: |
          set -euo pipefail
          if [ "${EVIDENCE_REQUIRED}" = "true" ] && [ "${APPROVED}" != "true" ]; then
            echo "::error::Evidence approval is required before a visual or evidence-contract pull request can be reviewed as green. Add the interface-preview-approved label to publish the isolated preview and capture deterministic browser evidence."
            exit 1
          fi
          echo "Evidence approval gate passed for ${ROUTE_COUNT} route(s)."

  deploy-preview:
    name: Publish non-production interface preview
    needs: [validate, approval-gate]
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'interface-preview-approved')
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: public-interface-preview
      url: ${{ steps.preview.outputs.preview_url }}
    outputs:
      preview_url: ${{ steps.preview.outputs.preview_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PROJECT_NAME: atlas-systems
      PAGES_BRANCH: interface-pr-${{ github.event.pull_request.number }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out interface site branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Guard production boundary
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${SOURCE_BRANCH}" != "main"
          test "${SOURCE_BRANCH}" != "production"
          test "${PAGES_BRANCH}" != "main"
          test "${PAGES_BRANCH}" != "production"
      - name: Prepare filtered Pages publish artifact
        run: bash scripts/prepare_pages_publish.sh "${RUNNER_TEMP}/pages-publish"
      - name: Publish branch preview
        id: deploy
        env:
          PUBLISH_DIRECTORY: ${{ runner.temp }}/pages-publish
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/wrangler-pages-deploy.log"
          npx --yes wrangler@4.113.0 pages deploy "${PUBLISH_DIRECTORY}" --project-name "${PROJECT_NAME}" --branch "${PAGES_BRANCH}" --commit-dirty=true 2>&1 | tee "${output_file}"
          atomic_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "${output_file}" | tail -n 1)"
          test -n "${atomic_url}"
          echo "atomic_url=${atomic_url}" >> "${GITHUB_OUTPUT}"
      - name: Resolve stable preview URL
        id: preview
        env:
          PREVIEW_URL: https://interface-pr-${{ github.event.pull_request.number }}.atlas-systems-44t.pages.dev
        run: |
          set -euo pipefail
          echo "preview_url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          printf '## Public interface preview\n\n%s\n\nAtomic deployment: %s\n\nProduction is unchanged.\n' "${PREVIEW_URL}" "${{ steps.deploy.outputs.atomic_url }}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Attach preview to draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ATOMIC_URL: ${{ steps.deploy.outputs.atomic_url }}
        run: |
          set -euo pipefail
          marker="<!-- atlas-public-interface-preview -->"
          body="${marker}
          ## Live interface preview

          - Estate preview: ${PREVIEW_URL}
          - Atomic deployment: ${ATOMIC_URL}
          - Commit: \`${{ github.event.pull_request.head.sha }}\`
          - Production: unchanged

          Generated article previews remain a separate scheduler-authorised evidence path."
          existing_id="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="${body}"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi

  capture-evidence:
    name: Capture deterministic interface evidence
    needs: [validate, deploy-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CHANGED_ROUTES_JSON: ${{ needs.validate.outputs.changed_routes_json }}
    steps:
      - name: Check out evidence runners
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            scripts/capture_interface_evidence.mjs
            scripts/capture_batch_h_evidence.mjs
            scripts/interface-evidence
            scripts/smoke_system_map_card_field_preview.mjs
            scripts/smoke_directory_header_fields_preview.mjs
            sitemap.xml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Install pinned browser and accessibility tooling
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/interface-evidence"
          cp scripts/capture_interface_evidence.mjs "${RUNNER_TEMP}/interface-evidence/"
          cp scripts/capture_batch_h_evidence.mjs "${RUNNER_TEMP}/interface-evidence/"
          cp scripts/smoke_system_map_card_field_preview.mjs "${RUNNER_TEMP}/interface-evidence/"
          cp scripts/smoke_directory_header_fields_preview.mjs "${RUNNER_TEMP}/interface-evidence/"
          cp sitemap.xml "${RUNNER_TEMP}/interface-evidence/"
          cp -R scripts/interface-evidence "${RUNNER_TEMP}/interface-evidence/"
          cd "${RUNNER_TEMP}/interface-evidence"
          npm init -y >/dev/null
          npm install --save-exact playwright@1.61.1 @axe-core/playwright@4.12.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium firefox
      - name: Verify System Map card AtlasField pixels
        working-directory: ${{ runner.temp }}/interface-evidence
        env:
          SYSTEM_MAP_FIELD_OUTPUT_DIR: ${{ runner.temp }}/interface-evidence/system-map-card-field-preview-smoke
        run: node smoke_system_map_card_field_preview.mjs
      - name: Verify directory header AtlasField pixels and uniformity
        working-directory: ${{ runner.temp }}/interface-evidence
        env:
          DIRECTORY_HEADER_FIELD_OUTPUT_DIR: ${{ runner.temp }}/interface-evidence/directory-header-field-preview-smoke
        run: node smoke_directory_header_fields_preview.mjs
      - name: Capture route-derived browser and viewport evidence
        id: route-capture
        if: always()
        continue-on-error: true
        working-directory: ${{ runner.temp }}/interface-evidence
        run: node capture_interface_evidence.mjs
      - name: Capture Batch H product assertions
        id: batch-h-capture
        if: always()
        continue-on-error: true
        working-directory: ${{ runner.temp }}/interface-evidence
        run: node capture_batch_h_evidence.mjs
      - name: Upload route-derived visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: public-interface-preview-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/interface-evidence/evidence.json
            ${{ runner.temp }}/interface-evidence/capture-error.txt
            ${{ runner.temp }}/interface-evidence/screenshots/*.png
            ${{ runner.temp }}/interface-evidence/system-map-card-field-preview-smoke/evidence.json
            ${{ runner.temp }}/interface-evidence/system-map-card-field-preview-smoke/system-map-card-field-preview.png
            ${{ runner.temp }}/interface-evidence/directory-header-field-preview-smoke/evidence.json
            ${{ runner.temp }}/interface-evidence/directory-header-field-preview-smoke/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Batch H visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: batch-h-preview-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/interface-evidence/batch-h-evidence.json
            ${{ runner.temp }}/interface-evidence/batch-h-capture-error.txt
            ${{ runner.temp }}/interface-evidence/batch-h-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Enforce browser evidence capture results
        if: always()
        env:
          ROUTE_CAPTURE_OUTCOME: ${{ steps.route-capture.outcome }}
          BATCH_H_CAPTURE_OUTCOME: ${{ steps.batch-h-capture.outcome }}
        run: |
          set -euo pipefail
          failed=0
          if [ "${ROUTE_CAPTURE_OUTCOME}" != "success" ]; then
            echo "::error::Route-derived browser evidence capture failed. Inspect the uploaded route-derived evidence artifact for the primary findings."
            failed=1
          fi
          if [ "${BATCH_H_CAPTURE_OUTCOME}" != "success" ]; then
            echo "::error::Batch H browser evidence capture failed. Inspect the uploaded Batch H evidence artifact for the primary findings."
            failed=1
          fi
          exit "${failed}"

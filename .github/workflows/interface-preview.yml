name: Public interface preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/interface-preview.yml"
      - "favicon.ico"
      - "favicon-16x16.png"
      - "favicon-32x32.png"
      - "apple-touch-icon.png"
      - "android-chrome-192x192.png"
      - "android-chrome-512x512.png"
      - "site.webmanifest"
      - "static/css/estate-shell.css"
      - "static/js/estate-shell.js"
      - "static/js/estate-status.js"
      - "static/js/estate-search/render.js"
      - "lab/shared/**"
      - "lab/proof-chain/proof-chain.js"
      - "lab/proof-chain/proof-chain-core.js"
      - "lab/signal/signal-v2.js"
      - "lab/signal/signal-v2-core.js"
      - "lab/anomaly/anomaly.js"
      - "lab/anomaly/anomaly-core.js"
      - "lab/conformance/conformance.js"
      - "lab/conformance/conformance-core.js"
      - "lab/reliability/reliability.js"
      - "lab/reliability/reliability-core.js"
      - "js/tests/public-interface-contract.test.mjs"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-public-interface-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate interface preview candidate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/public-interface-shell-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"

      - name: Validate site and interface contracts
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 "**/*.html"
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          python3 scripts/generate_sitemap.py --check-only
          python3 scripts/verify_pages_output.py .
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY
          git diff --check

      - name: Check repository links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments --root-dir ${{ github.workspace }} ."
          fail: true

  deploy-preview:
    name: Publish non-production interface preview
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/public-interface-shell-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: public-interface-preview
      url: ${{ steps.preview.outputs.preview_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PROJECT_NAME: atlas-systems
      PAGES_BRANCH: interface-pr-${{ github.event.pull_request.number }}
      ARTICLE_GENERATOR_REF: feat/article-interface-contract-v1
    steps:
      - name: Check out interface site branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check out article generator interface branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          repository: AtlasReaper311/atlas-article-gen
          ref: ${{ env.ARTICLE_GENERATOR_REF }}
          path: .article-generator
          persist-credentials: false

      - name: Check out current scheduler preview engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          repository: AtlasReaper311/atlas-scheduler
          ref: main
          path: .article-scheduler
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: "3.12"

      - name: Build article shell through generator and scheduler preview
        run: |
          set -euo pipefail
          python -m pip install -r .article-generator/requirements-dev.txt
          mkdir -p .article-preview-queue
          python .article-generator/scripts/build_article.py \
            .article-generator/tests/fixtures/interface-contract-preview.md \
            --out .article-preview-queue
          python .article-scheduler/scripts/preview_selected.py \
            --scheduled-dir .article-preview-queue \
            --site-dir . \
            --output-dir .interface-preview-site \
            --report-out .article-preview-report.json \
            --through-w-number 99
          test -s .interface-preview-site/writing/interface-contract-preview/index.html
          grep -q 'data-estate-search-open' .interface-preview-site/writing/interface-contract-preview/index.html
          grep -q 'atlas-estate-status' .interface-preview-site/writing/interface-contract-preview/index.html
          grep -q '.prose p{font-size:15px;line-height:1.8}' .interface-preview-site/writing/interface-contract-preview/index.html
          test "$(grep -c 'SCHEDULER_FOOTER_INSERT' .interface-preview-site/writing/interface-contract-preview/index.html)" -eq 1
          npx --yes html-validate@9.7.1 ".interface-preview-site/**/*.html"

      - name: Smoke-test generated preview routes
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory .interface-preview-site > /tmp/interface-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          routes = ["/", "/writing/", "/work/", "/writing/interface-contract-preview/"]
          last_error = None
          for _ in range(20):
              try:
                  for route in routes:
                      with urllib.request.urlopen("http://127.0.0.1:4173" + route, timeout=5) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{route} returned {response.status}")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.25)
          else:
              raise SystemExit(f"preview route smoke test failed: {last_error}")
          PY

      - name: Guard production boundary
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "feat/public-interface-shell-v1"
          test "${PAGES_BRANCH}" != "main"
          test "${PAGES_BRANCH}" != "production"

      - name: Publish branch preview
        id: deploy
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/wrangler-pages-deploy.log"
          npx --yes wrangler@4 pages deploy .interface-preview-site \
            --project-name "${PROJECT_NAME}" \
            --branch "${PAGES_BRANCH}" \
            --commit-dirty=true 2>&1 | tee "${output_file}"
          atomic_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "${output_file}" | tail -n 1)"
          test -n "${atomic_url}"
          echo "atomic_url=${atomic_url}" >> "${GITHUB_OUTPUT}"

      - name: Resolve stable preview URL
        id: preview
        env:
          PREVIEW_URL: https://interface-pr-${{ github.event.pull_request.number }}.atlas-systems-44t.pages.dev
        run: |
          set -euo pipefail
          echo "preview_url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Public interface preview"
            echo
            echo "${PREVIEW_URL}"
            echo
            echo "Article shell: ${PREVIEW_URL}/writing/interface-contract-preview/"
            echo
            echo "Atomic deployment: ${{ steps.deploy.outputs.atomic_url }}"
            echo
            echo "This is a non-production Cloudflare Pages branch preview. atlas-systems.uk is unchanged."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Attach preview to draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ATOMIC_URL: ${{ steps.deploy.outputs.atomic_url }}
        run: |
          set -euo pipefail
          marker="<!-- atlas-public-interface-preview -->"
          body="${marker}
          ## Live interface preview

          - Estate preview: ${PREVIEW_URL}
          - Generated article: ${PREVIEW_URL}/writing/interface-contract-preview/
          - Atomic deployment: ${ATOMIC_URL}
          - Production: unchanged

          The article route was built by \`atlas-article-gen\` and rendered through the current \`atlas-scheduler\` preview engine. This preview was built from site commit \`${{ github.event.pull_request.head.sha }}\`."
          existing_id="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="${body}"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi

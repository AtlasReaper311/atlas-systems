name: Public interface preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/interface-preview.yml"
      - "_headers"
      - "404.html"
      - "index.html"
      - "systems/**"
      - "static/css/estate-shell.css"
      - "static/css/v2-directory-pages.css"
      - "static/vendor/atlas-interface/**"
      - "static/js/estate-shell.js"
      - "static/js/estate-status.js"
      - "static/js/estate-search/**"
      - "lab/index.html"
      - "lab/console/**"
      - "lab/system-map/**"
      - "lab/shared/**"
      - "lab/proof-chain/**"
      - "lab/signal/**"
      - "lab/anomaly/**"
      - "lab/conformance/**"
      - "lab/reliability/**"
      - "js/tests/public-interface-contract.test.mjs"
      - "scripts/generate_sitemap.py"
      - "scripts/verify_interface_bundle.py"
      - "sitemap.xml"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-public-interface-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate interface preview candidate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/public-interface-system-v2-primary-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Validate site and interface contracts
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 "**/*.html"
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          python3 scripts/verify_interface_bundle.py
          python3 scripts/generate_sitemap.py --check-only
          python3 scripts/verify_pages_output.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path(".").rglob("*.json")):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          PY
          git diff --check
      - name: Check repository links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments --root-dir ${{ github.workspace }} ."
          format: detailed
          output: interface-link-report.txt
          fail: true
      - name: Upload interface link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: interface-link-report
          path: interface-link-report.txt
          if-no-files-found: warn
          retention-days: 7

  deploy-preview:
    name: Publish non-production interface preview
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/public-interface-system-v2-primary-site'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: public-interface-preview
      url: ${{ steps.preview.outputs.preview_url }}
    outputs:
      preview_url: ${{ steps.preview.outputs.preview_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PROJECT_NAME: atlas-systems
      PAGES_BRANCH: interface-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check out interface site branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Guard production boundary
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "agent/public-interface-system-v2-primary-site"
          test "${PAGES_BRANCH}" != "main"
          test "${PAGES_BRANCH}" != "production"
      - name: Publish branch preview
        id: deploy
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/wrangler-pages-deploy.log"
          npx --yes wrangler@4.113.0 pages deploy . --project-name "${PROJECT_NAME}" --branch "${PAGES_BRANCH}" --commit-dirty=true 2>&1 | tee "${output_file}"
          atomic_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "${output_file}" | tail -n 1)"
          test -n "${atomic_url}"
          echo "atomic_url=${atomic_url}" >> "${GITHUB_OUTPUT}"
      - name: Resolve stable preview URL
        id: preview
        env:
          PREVIEW_URL: https://interface-pr-${{ github.event.pull_request.number }}.atlas-systems-44t.pages.dev
        run: |
          set -euo pipefail
          echo "preview_url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          printf '## Public interface preview\n\n%s\n\nAtomic deployment: %s\n\nProduction is unchanged.\n' "${PREVIEW_URL}" "${{ steps.deploy.outputs.atomic_url }}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Attach preview to draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ATOMIC_URL: ${{ steps.deploy.outputs.atomic_url }}
        run: |
          set -euo pipefail
          marker="<!-- atlas-public-interface-preview -->"
          body="${marker}
          ## Live interface preview

          - Estate preview: ${PREVIEW_URL}
          - Atomic deployment: ${ATOMIC_URL}
          - Commit: \`${{ github.event.pull_request.head.sha }}\`
          - Production: unchanged

          Generated article previews remain a separate scheduler-authorised evidence path."
          existing_id="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="${body}"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi

  capture-evidence:
    name: Capture deterministic interface evidence
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Install pinned browser and accessibility tooling
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/interface-evidence"
          cd "${RUNNER_TEMP}/interface-evidence"
          npm init -y >/dev/null
          npm install --save-exact playwright@1.61.1 @axe-core/playwright@4.12.1
          npm audit --audit-level=high
          npx playwright install --with-deps chrome firefox
      - name: Capture governed browser and viewport matrix
        working-directory: ${{ runner.temp }}/interface-evidence
        run: |
          set -euo pipefail
          mkdir -p screenshots
          node <<'JS'
          const { chromium, firefox } = require("playwright");
          const AxeBuilder = require("@axe-core/playwright").default;
          const fs = require("node:fs");

          const base = process.env.PREVIEW_URL;
          const routes = [
            ["home", "/"],
            ["systems", "/systems/"],
            ["lab", "/lab/"],
            ["system-map", "/lab/system-map/"],
            ["console", "/lab/console/"],
            ["work", "/work/"],
            ["writing", "/writing/"],
            ["about", "/about/"],
          ];
          const viewports = [
            ["320", { width: 320, height: 760 }],
            ["375", { width: 375, height: 812 }],
            ["768", { width: 768, height: 900 }],
            ["1024", { width: 1024, height: 900 }],
            ["1440", { width: 1440, height: 1000 }],
          ];
          const browsers = [
            ["chrome", () => chromium.launch({ channel: "chrome", headless: true })],
            ["firefox", () => firefox.launch({ headless: true })],
          ];
          const fixtureHosts = new Set([
            "api.atlas-systems.uk",
            "corpus.atlas-systems.uk",
            "ramone.atlas-systems.uk",
          ]);
          const report = [];

          function writeReport() {
            fs.writeFileSync("evidence.json", JSON.stringify({
              preview: base,
              commit: process.env.HEAD_SHA,
              fixture: "deterministic-unavailable",
              browsers: browsers.map(([name]) => name),
              viewports: viewports.map(([name]) => Number(name)),
              routes: report,
            }, null, 2) + "\n");
          }

          async function openWithRetry(page, url) {
            let lastError;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 30_000 });
                if (!response || !response.ok()) throw new Error(`HTTP ${response?.status() ?? "no response"}`);
                await page.waitForSelector(".atlas-header__brand", { timeout: 15_000 });
                await page.waitForSelector(".atlas-header__actions", { timeout: 15_000 });
                await page.evaluate(() => document.fonts?.ready || Promise.resolve());
                await page.waitForTimeout(700);
                return;
              } catch (error) {
                lastError = error;
                await page.waitForTimeout(attempt * 1_000);
              }
            }
            throw lastError;
          }

          async function configureContext(context) {
            await context.addInitScript(() => {
              Object.defineProperty(window, "__ATLAS_EVIDENCE_MODE__", {
                value: "deterministic-unavailable",
                configurable: false,
                writable: false,
              });
            });
            await context.route("**/*", async (route) => {
              const url = new URL(route.request().url());
              if (fixtureHosts.has(url.hostname)) {
                await route.fulfill({
                  status: 503,
                  contentType: "application/json",
                  headers: { "cache-control": "no-store" },
                  body: JSON.stringify({ error: "deterministic preview fixture" }),
                });
                return;
              }
              await route.continue();
            });
          }

          async function inspectPage(page, browserName, viewportName, routeName) {
            const evidence = await page.evaluate(() => {
              function selectorFor(element) {
                if (!element || element === document.documentElement) return "html";
                if (element.id) return `#${CSS.escape(element.id)}`;
                const classes = [...element.classList].slice(0, 3).map((name) => `.${CSS.escape(name)}`).join("");
                return `${element.tagName.toLowerCase()}${classes}`;
              }
              const width = document.documentElement.clientWidth;
              const scrollWidth = document.documentElement.scrollWidth;
              const overflow = [...document.querySelectorAll("body *")]
                .map((element) => {
                  const rect = element.getBoundingClientRect();
                  return {
                    selector: selectorFor(element),
                    left: Math.round(rect.left),
                    right: Math.round(rect.right),
                    width: Math.round(rect.width),
                  };
                })
                .filter((item) => item.left < -1 || item.right > width + 1)
                .sort((a, b) => b.width - a.width)
                .slice(0, 12);
              const mobileNav = document.querySelector(".atlas-mobile-nav");
              const mobileVisible = Boolean(mobileNav) && getComputedStyle(mobileNav).display !== "none";
              const navHeight = mobileVisible ? mobileNav.getBoundingClientRect().height : 0;
              const bodyPaddingBottom = Number.parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
              return {
                title: document.title,
                width,
                scrollWidth,
                overflow,
                h1Count: document.querySelectorAll("h1").length,
                mainCount: document.querySelectorAll("main").length,
                systemsLink: Boolean([...document.querySelectorAll(".atlas-header__nav a")].find((link) => link.textContent.trim() === "Systems")),
                mobileVisible,
                mobileActive: document.querySelectorAll('.atlas-mobile-nav [aria-current="page"]').length,
                navHeight,
                bodyPaddingBottom,
                canonical: document.querySelector('link[rel="canonical"]')?.href || null,
                fixtureMode: window.__ATLAS_EVIDENCE_MODE__ || null,
              };
            });

            if (!evidence.title.includes("Atlas Systems")) throw new Error(`${browserName}/${viewportName}/${routeName}: title does not include Atlas Systems`);
            if (evidence.h1Count !== 1) throw new Error(`${browserName}/${viewportName}/${routeName}: expected one h1, found ${evidence.h1Count}`);
            if (evidence.mainCount !== 1) throw new Error(`${browserName}/${viewportName}/${routeName}: expected one main landmark, found ${evidence.mainCount}`);
            if (!evidence.systemsLink) throw new Error(`${browserName}/${viewportName}/${routeName}: Systems is missing from desktop navigation`);
            if (evidence.scrollWidth > evidence.width + 1) {
              throw new Error(`${browserName}/${viewportName}/${routeName}: horizontal overflow ${evidence.scrollWidth} > ${evidence.width}; ${JSON.stringify(evidence.overflow)}`);
            }
            const mobileExpected = Number(viewportName) < 768;
            if (mobileExpected !== evidence.mobileVisible) throw new Error(`${browserName}/${viewportName}/${routeName}: mobile navigation visibility is incorrect`);
            if (mobileExpected && evidence.bodyPaddingBottom + 1 < evidence.navHeight) throw new Error(`${browserName}/${viewportName}/${routeName}: bottom navigation can obscure content or focus`);
            if (mobileExpected && routeName !== "home" && evidence.mobileActive !== 1) throw new Error(`${browserName}/${viewportName}/${routeName}: active mobile route is missing`);
            if (evidence.fixtureMode !== "deterministic-unavailable") throw new Error(`${browserName}/${viewportName}/${routeName}: deterministic fixture mode is missing`);
            if (evidence.canonical && !evidence.canonical.startsWith("https://atlas-systems.uk/")) throw new Error(`${browserName}/${viewportName}/${routeName}: preview hostname entered canonical metadata`);
            return evidence;
          }

          async function run() {
            for (const [browserName, launch] of browsers) {
              const browser = await launch();
              try {
                for (const [viewportName, viewport] of viewports) {
                  const context = await browser.newContext({ viewport, reducedMotion: "reduce", serviceWorkers: "block" });
                  await configureContext(context);
                  try {
                    for (const [routeName, route] of routes) {
                      const page = await context.newPage();
                      const pageErrors = [];
                      page.on("pageerror", (error) => pageErrors.push(error.message));
                      const url = new URL(route, base).toString();
                      await openWithRetry(page, url);
                      const semantics = await inspectPage(page, browserName, viewportName, routeName);
                      const accessibility = await new AxeBuilder({ page })
                        .withTags(["wcag2a", "wcag2aa", "wcag21a", "wcag21aa"])
                        .analyze();
                      const blocking = accessibility.violations.filter((item) => item.impact === "serious" || item.impact === "critical");
                      const fullPage = `screenshots/${browserName}-${viewportName}-${routeName}-full.png`;
                      await page.screenshot({ path: fullPage, fullPage: true });
                      let viewportShot = null;
                      if (Number(viewportName) < 768) {
                        viewportShot = `screenshots/${browserName}-${viewportName}-${routeName}-viewport.png`;
                        await page.screenshot({ path: viewportShot, fullPage: false });
                      }
                      report.push({
                        browser: browserName,
                        viewport: viewportName,
                        route,
                        url,
                        semantics,
                        pageErrors,
                        accessibilityViolations: accessibility.violations.map((item) => ({ id: item.id, impact: item.impact, nodes: item.nodes.length })),
                        screenshots: { fullPage, viewport: viewportShot },
                      });
                      writeReport();
                      if (pageErrors.length) throw new Error(`${browserName}/${viewportName}/${routeName}: page errors ${JSON.stringify(pageErrors)}`);
                      if (blocking.length) {
                        const summary = blocking.map((item) => ({ id: item.id, impact: item.impact, nodes: item.nodes.length }));
                        throw new Error(`${browserName}/${viewportName}/${routeName}: serious accessibility findings ${JSON.stringify(summary)}`);
                      }
                      await page.close();
                    }
                  } finally {
                    await context.close();
                  }
                }
              } finally {
                await browser.close();
              }
            }
            writeReport();
          }

          run().catch((error) => {
            fs.writeFileSync("capture-error.txt", `${error.stack || error.message}\n`);
            process.exit(1);
          });
          JS
      - name: Upload visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: public-interface-preview-evidence
          path: |
            ${{ runner.temp }}/interface-evidence/evidence.json
            ${{ runner.temp }}/interface-evidence/capture-error.txt
            ${{ runner.temp }}/interface-evidence/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

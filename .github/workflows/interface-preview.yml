name: Public interface preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/interface-preview.yml"
      - "_headers"
      - "404.html"
      - "index.html"
      - "systems/**"
      - "static/css/estate-shell.css"
      - "static/css/v2-directory-pages.css"
      - "static/vendor/atlas-interface/**"
      - "static/js/estate-shell.js"
      - "static/js/estate-status.js"
      - "static/js/estate-search/**"
      - "lab/index.html"
      - "lab/console/**"
      - "lab/system-map/**"
      - "lab/shared/**"
      - "lab/proof-chain/**"
      - "lab/signal/**"
      - "lab/anomaly/**"
      - "lab/conformance/**"
      - "lab/reliability/**"
      - "js/tests/public-interface-contract.test.mjs"
      - "scripts/generate_sitemap.py"
      - "sitemap.xml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-public-interface-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate interface preview candidate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/public-interface-system-v2-primary-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Validate site and interface contracts
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 "**/*.html"
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          python3 scripts/generate_sitemap.py --check-only
          python3 scripts/verify_pages_output.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path(".").rglob("*.json")):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          PY
          git diff --check
      - name: Check repository links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments --root-dir ${{ github.workspace }} ."
          format: detailed
          output: interface-link-report.txt
          fail: true
      - name: Upload interface link report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interface-link-report
          path: interface-link-report.txt
          if-no-files-found: warn
          retention-days: 7

  deploy-preview:
    name: Publish non-production interface preview
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/public-interface-system-v2-primary-site'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: public-interface-preview
      url: ${{ steps.preview.outputs.preview_url }}
    outputs:
      preview_url: ${{ steps.preview.outputs.preview_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PROJECT_NAME: atlas-systems
      PAGES_BRANCH: interface-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check out interface site branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Guard production boundary
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "agent/public-interface-system-v2-primary-site"
          test "${PAGES_BRANCH}" != "main"
          test "${PAGES_BRANCH}" != "production"
      - name: Publish branch preview
        id: deploy
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/wrangler-pages-deploy.log"
          npx --yes wrangler@4 pages deploy . --project-name "${PROJECT_NAME}" --branch "${PAGES_BRANCH}" --commit-dirty=true 2>&1 | tee "${output_file}"
          atomic_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "${output_file}" | tail -n 1)"
          test -n "${atomic_url}"
          echo "atomic_url=${atomic_url}" >> "${GITHUB_OUTPUT}"
      - name: Resolve stable preview URL
        id: preview
        env:
          PREVIEW_URL: https://interface-pr-${{ github.event.pull_request.number }}.atlas-systems-44t.pages.dev
        run: |
          set -euo pipefail
          echo "preview_url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          printf '## Public interface preview\n\n%s\n\nAtomic deployment: %s\n\nProduction is unchanged.\n' "${PREVIEW_URL}" "${{ steps.deploy.outputs.atomic_url }}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Attach preview to draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ATOMIC_URL: ${{ steps.deploy.outputs.atomic_url }}
        run: |
          set -euo pipefail
          marker="<!-- atlas-public-interface-preview -->"
          body="${marker}
          ## Live interface preview

          - Estate preview: ${PREVIEW_URL}
          - Atomic deployment: ${ATOMIC_URL}
          - Commit: \`${{ github.event.pull_request.head.sha }}\`
          - Production: unchanged

          Generated article previews remain a separate scheduler-authorised evidence path."
          existing_id="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="${body}"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi

  capture-evidence:
    name: Capture representative interface evidence
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Install pinned browser tooling
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/interface-evidence"
          cd "${RUNNER_TEMP}/interface-evidence"
          npm init -y >/dev/null
          npm install --save-exact playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile routes
        working-directory: ${{ runner.temp }}/interface-evidence
        run: |
          set -euo pipefail
          mkdir -p screenshots
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          process.on('uncaughtException', (error) => {
            fs.writeFileSync('capture-error.txt', `${error.stack || error.message}\n`);
            process.exit(1);
          });
          const base = process.env.PREVIEW_URL;
          const routes = [
            ['home', '/'],
            ['systems', '/systems/'],
            ['lab', '/lab/'],
            ['system-map', '/lab/system-map/'],
            ['console', '/lab/console/'],
            ['work', '/work/'],
            ['writing', '/writing/'],
            ['about', '/about/'],
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 375, height: 812 }],
          ];
          const report = [];
          async function openWithRetry(page, url) {
            let lastError;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30_000 });
                if (!response || !response.ok()) throw new Error(`HTTP ${response?.status() ?? 'no response'}`);
                await page.waitForTimeout(1_500);
                return response;
              } catch (error) {
                lastError = error;
                await page.waitForTimeout(attempt * 1_000);
              }
            }
            throw lastError;
          }
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const [viewportName, viewport] of viewports) {
              const context = await browser.newContext({ viewport, reducedMotion: 'reduce' });
              for (const [name, route] of routes) {
                const page = await context.newPage();
                const pageErrors = [];
                page.on('pageerror', (error) => pageErrors.push(error.message));
                const url = new URL(route, base).toString();
                await openWithRetry(page, url);
                await page.waitForSelector('.atlas-header__brand', { timeout: 15_000 });
                await page.waitForSelector('.atlas-header__actions', { timeout: 15_000 });
                const evidence = await page.evaluate(() => ({
                  title: document.title,
                  width: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  systemsLink: Boolean([...document.querySelectorAll('.atlas-header__nav a')].find((link) => link.textContent.trim() === 'Systems')),
                  mobileNav: getComputedStyle(document.querySelector('.atlas-mobile-nav')).display,
                }));
                if (!evidence.title.includes('Atlas Systems')) throw new Error(`${name}: title does not include Atlas Systems`);
                if (!evidence.systemsLink) throw new Error(`${name}: Systems is missing from desktop navigation`);
                if (evidence.scrollWidth > evidence.width + 1) throw new Error(`${name}: horizontal overflow ${evidence.scrollWidth} > ${evidence.width}`);
                if (viewportName === 'mobile' && evidence.mobileNav === 'none') throw new Error(`${name}: mobile navigation is hidden`);
                const file = `screenshots/${viewportName}-${name}.png`;
                await page.screenshot({ path: file, fullPage: true });
                report.push({ viewport: viewportName, route, url, title: evidence.title, pageErrors, screenshot: file });
                await page.close();
              }
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('evidence.json', JSON.stringify({ preview: base, commit: process.env.GITHUB_SHA, routes: report }, null, 2) + '\n');
          })();
          JS
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-interface-preview-evidence
          path: |
            ${{ runner.temp }}/interface-evidence/evidence.json
            ${{ runner.temp }}/interface-evidence/capture-error.txt
            ${{ runner.temp }}/interface-evidence/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

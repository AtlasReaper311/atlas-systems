name: Generated article interface preview

on:
  push:
    branches:
      - article-shell-pr-49-source

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-article-interface-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Validate and publish generated article preview branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: article-interface-preview
      url: ${{ steps.preview.outputs.preview_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      PROJECT_NAME: atlas-systems
      PAGES_BRANCH: article-shell-pr-49
    steps:
      - name: Check out scheduler-prepared preview branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: article-shell-pr-49-source
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"

      - name: Validate generated preview site
        run: |
          set -euo pipefail
          page="writing/interface-contract-preview/index.html"
          test -s "${page}"
          grep -q 'data-estate-search-open' "${page}"
          grep -q 'atlas-estate-status' "${page}"
          grep -q '.prose p{font-size:15px;line-height:1.8}' "${page}"
          grep -q 'class="article-footer"' "${page}"
          ! grep -q 'AUTO-FOOTER: filled in by atlas-scheduler at publish time' "${page}"
          npx --yes html-validate@9.7.1 "${page}"
          python3 scripts/verify_pages_output.py .
          git diff --check

      - name: Guard production boundary
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "article-shell-pr-49-source"
          test "${PAGES_BRANCH}" != "main"
          test "${PAGES_BRANCH}" != "production"

      - name: Publish non-production Pages branch
        id: deploy
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/wrangler-pages-deploy.log"
          npx --yes wrangler@4 pages deploy . \
            --project-name "${PROJECT_NAME}" \
            --branch "${PAGES_BRANCH}" \
            --commit-dirty=true 2>&1 | tee "${output_file}"
          atomic_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "${output_file}" | tail -n 1)"
          test -n "${atomic_url}"
          echo "atomic_url=${atomic_url}" >> "${GITHUB_OUTPUT}"

      - name: Resolve stable preview URL
        id: preview
        env:
          PREVIEW_URL: https://article-shell-pr-49.atlas-systems-44t.pages.dev
        run: |
          set -euo pipefail
          echo "preview_url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Generated article interface preview"
            echo
            echo "${PREVIEW_URL}/writing/interface-contract-preview/"
            echo
            echo "Atomic deployment: ${{ steps.deploy.outputs.atomic_url }}"
            echo
            echo "This is a non-production branch preview. No article was published and both production indexes remain unchanged."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Attach article preview to draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          ATOMIC_URL: ${{ steps.deploy.outputs.atomic_url }}
        run: |
          set -euo pipefail
          marker="<!-- atlas-generated-article-preview -->"
          body="${marker}
          ## Generated article interface preview

          - Contract fixture: ${PREVIEW_URL}/writing/interface-contract-preview/
          - Atomic deployment: ${ATOMIC_URL}
          - Production: unchanged

          The fixture was rendered by \`atlas-article-gen\` and completed through the scheduler-owned publication function. Writing and Work indexes were byte-checked as unchanged before the branch handoff. Published article refresh behaviour remains covered by the green scheduler PR test suite because their canonical Markdown sources are not present in the generator repository."
          existing_id="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/49/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${existing_id}" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="${body}"
          else
            gh pr comment 49 --body "${body}"
          fi

name: Apply System Symphony production cutover

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: system-symphony-apu-production-cutover
  cancel-in-progress: false

jobs:
  apply-cutover:
    name: Integrate Atlas APU behind the preserved live map
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/system-symphony-apu-production-rollout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/system-symphony-apu-production-rollout
          fetch-depth: 0
          persist-credentials: true

      - name: Remove obsolete page-script assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_system_symphony_cutover.py")
          text = path.read_text(encoding="utf-8")
          obsolete = '''replace_once(
              page_js,
              "Initialising the existing System Symphony engine.",
              "Initialising the Atlas APU renderer and preserved topology interface.",
          )
          '''
          if text.count(obsolete) != 1:
              raise SystemExit("Expected exactly one obsolete page-script assertion")
          path.write_text(text.replace(obsolete, "", 1), encoding="utf-8")
          PY

      - name: Apply reviewed production integration
        id: cutover
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply_system_symphony_cutover.py 2>&1 | tee cutover-report.txt

      - name: Upload cutover diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: system-symphony-cutover-report
          path: cutover-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce cutover result
        if: steps.cutover.outcome != 'success'
        run: |
          cat cutover-report.txt
          exit 1

      - name: Commit the cutover and remove temporary tooling
        if: steps.cutover.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rollout-cutover.yml
          rm -f scripts/apply_system_symphony_cutover.py
          rm -f cutover-report.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(symphony): promote Atlas APU behind the live estate map"
          git push origin HEAD:feat/system-symphony-apu-production-rollout

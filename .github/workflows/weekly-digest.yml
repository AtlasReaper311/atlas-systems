name: Weekly Digest

on:
  schedule:
    - cron: '0 18 * * 0'   # every Sunday, 18:00 UTC
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: ${{ github.repository }}-weekly-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build and post weekly digest
        env:
          # --- Why a PAT, not GITHUB_TOKEN ---
          # GITHUB_TOKEN is scoped to this repo only. When calling the
          # Commits API on OTHER repos with ?author=USERNAME, GitHub
          # needs to resolve the login to a git author email — a
          # lookup that silently fails with a repo-scoped token,
          # returning an empty array instead of an error. A fine-grained
          # PAT with contents:read on all repos fixes this and also
          # surfaces private repos (like atlas-scheduler) in the new
          # repos count. The PAT needs: Contents (read) on All
          # repositories under the AtlasReaper311 account.
          GH_AUTH: "Authorization: Bearer ${{ secrets.GH_DIGEST_PAT }}"
        run: |
          set -uo pipefail

          USERNAME="AtlasReaper311"
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          SINCE_DATE=$(date -u -d '7 days ago' +%Y-%m-%d)

          # --- Fetch base data ---
          # /user/repos (not /users/USERNAME/repos) returns ALL repos
          # the token can see, including private ones. Requires a PAT.
          USER_DATA=$(curl -sf -H "$GH_AUTH" "https://api.github.com/users/$USERNAME" || echo '{}')
          echo "$USER_DATA" | jq empty 2>/dev/null || USER_DATA='{}'

          REPOS_DATA=$(curl -sf -H "$GH_AUTH" "https://api.github.com/user/repos?per_page=100&affiliation=owner" || echo '[]')
          echo "$REPOS_DATA" | jq empty 2>/dev/null || REPOS_DATA='[]'

          REPO_COUNT=$(echo "$REPOS_DATA" | jq 'if type=="array" then length else 0 end')
          echo "::debug::Found $REPO_COUNT repos to scan"

          # --- Commits (7d): ground truth from the Commits API ---
          # GitHub's events feed marks rapid pushes as "non-distinct",
          # undercounting commits. Querying each repo's Commits endpoint
          # directly, filtered to this account's own authored commits,
          # gives the real number. CI bot commits (badge updaters etc.)
          # are excluded by the author filter.
          REPO_NAMES=$(echo "$REPOS_DATA" | jq -r '.[] | select(.fork == false) | .name')
          COMMIT_COUNT=0
          LATEST_COMMIT_MSG="—"
          LATEST_COMMIT_DATE="0000-00-00T00:00:00Z"
          ACTIVE_REPOS=""
          MOST_ACTIVE_REPO="none"
          MOST_ACTIVE_COUNT=0
          COMMIT_DAYS_JSON="[]"

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue

            RESP=$(curl -sf -H "$GH_AUTH" \
              "https://api.github.com/repos/$USERNAME/$repo/commits?since=$SINCE&author=$USERNAME&per_page=100" \
              || echo '[]')

            # Guard against error objects (rate limit, not found, etc.)
            COUNT=$(echo "$RESP" | jq 'if type=="array" then length else 0 end' 2>/dev/null || echo 0)

            if [ "$COUNT" -gt 0 ] 2>/dev/null; then
              COMMIT_COUNT=$((COMMIT_COUNT + COUNT))

              # Track active repos
              if [ -n "$ACTIVE_REPOS" ]; then
                ACTIVE_REPOS="$ACTIVE_REPOS, $USERNAME/$repo"
              else
                ACTIVE_REPOS="$USERNAME/$repo"
              fi

              # Track the real most-active repo by commit count, not by
              # whichever repo happened to push most recently.
              if [ "$COUNT" -gt "$MOST_ACTIVE_COUNT" ] 2>/dev/null; then
                MOST_ACTIVE_COUNT="$COUNT"
                MOST_ACTIVE_REPO="$USERNAME/$repo"
              fi

              REPO_DAYS_JSON=$(echo "$RESP" | jq -c '
                if type=="array" then
                  [.[] | .commit.author.date // empty | fromdateiso8601 | strftime("%A")]
                else
                  []
                end
              ' 2>/dev/null || echo '[]')
              COMMIT_DAYS_JSON=$(jq -c -n --argjson a "$COMMIT_DAYS_JSON" --argjson b "$REPO_DAYS_JSON" '$a + $b')

              # Track latest commit across all repos
              NEWEST_DATE=$(echo "$RESP" | jq -r '.[0].commit.author.date // ""')
              NEWEST_MSG=$(echo "$RESP" | jq -r '.[0].commit.message // ""' | head -1)
              if [ -n "$NEWEST_DATE" ] && [[ "$NEWEST_DATE" > "$LATEST_COMMIT_DATE" ]]; then
                LATEST_COMMIT_DATE="$NEWEST_DATE"
                LATEST_COMMIT_MSG="$NEWEST_MSG"
              fi
            fi

            echo "::debug::$repo: $COUNT commits"
          done <<< "$REPO_NAMES"

          [ -z "$ACTIVE_REPOS" ] && ACTIVE_REPOS="none this week"

          if [ "$MOST_ACTIVE_COUNT" -gt 0 ] 2>/dev/null; then
            MOST_ACTIVE_REPO="${MOST_ACTIVE_REPO} (${MOST_ACTIVE_COUNT} commits)"
          fi

          BUSIEST_DAY=$(echo "$COMMIT_DAYS_JSON" | jq -r '
            group_by(.) | map({day: .[0], count: length}) | sort_by(-.count) | .[0].day // "—"
          ')

          # --- PRs and Issues (7d) ---
          # Events feed is fine here — PRs and issues generate fewer
          # events than pushes, so the 100-event window rarely clips them.
          EVENTS=$(curl -sf -H "$GH_AUTH" \
            "https://api.github.com/users/$USERNAME/events?per_page=100" || echo '[]')
          echo "$EVENTS" | jq empty 2>/dev/null || EVENTS='[]'

          PR_OPENED=$(echo "$EVENTS" | jq --arg since "$SINCE" '
            [.[] | select(.type=="PullRequestEvent" and .created_at>=$since and .payload.action=="opened")] | length
          ')
          PR_MERGED=$(echo "$EVENTS" | jq --arg since "$SINCE" '
            [.[] | select(.type=="PullRequestEvent" and .created_at>=$since and .payload.action=="closed" and .payload.pull_request.merged==true)] | length
          ')
          ISSUES_OPENED=$(echo "$EVENTS" | jq --arg since "$SINCE" '
            [.[] | select(.type=="IssuesEvent" and .created_at>=$since and .payload.action=="opened")] | length
          ')
          ISSUES_CLOSED=$(echo "$EVENTS" | jq --arg since "$SINCE" '
            [.[] | select(.type=="IssuesEvent" and .created_at>=$since and .payload.action=="closed")] | length
          ')

          # --- New repos (7d): ground truth via created_at ---
          # The events feed caps at 100 events and can scroll a
          # CreateEvent off the list. Every repo object carries a
          # created_at timestamp — filtering that directly is reliable.
          # Uses REPOS_DATA which now includes private repos via PAT.
          NEW_REPOS=$(echo "$REPOS_DATA" | jq -r --arg since "$SINCE" '
            [.[] | select(.fork == false and .created_at >= $since) | .name] | join(", ")
          ')
          [ -z "$NEW_REPOS" ] && NEW_REPOS="none"

          # --- All-time stats ---
          FOLLOWERS=$(echo "$USER_DATA" | jq -r '.followers // 0')
          PUBLIC_REPOS=$(echo "$USER_DATA" | jq -r '.public_repos // 0')
          TOTAL_STARS=$(echo "$REPOS_DATA" | jq '[.[].stargazers_count] | add // 0')

          # --- Site stats ---
          # site-pulse /weekly aggregates daily snapshots stored by the
          # Worker's cron trigger. Falls back to the live 24h endpoint
          # if /weekly returns 0 days (cron hasn't run yet).
          SITE_PULSE_NOW=$(curl -sf "https://api.atlas-systems.uk/site-pulse" || echo '{}')
          echo "$SITE_PULSE_NOW" | jq empty 2>/dev/null || SITE_PULSE_NOW='{}'

          TOP_PAGE_RAW=$(echo "$SITE_PULSE_NOW" | jq -r '
            def scanner:
              test("^/(wp-|wp-admin|wp-login|xmlrpc|\\.env|\\.aws|cgi-bin|admin|login|shell|zmia|vendor|boaform)|\\.php($|[?#])"; "i");
            def asset:
              test("\\.(js|css|png|jpe?g|webp|gif|svg|ico|xml|txt|map|json)($|[?#])"; "i");
            [.topPages[]? | select((.path | scanner | not) and (.path | asset | not))][0].path // "—"
          ')
          if [ "$TOP_PAGE_RAW" = "/" ]; then
            TOP_PAGE="/ (homepage)"
          elif [ "$TOP_PAGE_RAW" = "—" ]; then
            TOP_PAGE="—"
          else
            TOP_PAGE="$TOP_PAGE_RAW"
          fi

          SITE_PULSE_WEEKLY=$(curl -sf "https://api.atlas-systems.uk/site-pulse/weekly" || echo '{}')
          echo "$SITE_PULSE_WEEKLY" | jq empty 2>/dev/null || SITE_PULSE_WEEKLY='{}'
          SITE_VISITS=$(echo "$SITE_PULSE_WEEKLY" | jq -r '.totalVisits // 0')
          DAYS_COLLECTED=$(echo "$SITE_PULSE_WEEKLY" | jq -r '.daysCollected // 0')

          # Fall back to live 24h data if no daily snapshots exist yet
          if [ "$DAYS_COLLECTED" = "0" ] || [ "$DAYS_COLLECTED" = "null" ]; then
            SITE_VISITS=$(echo "$SITE_PULSE_NOW" | jq -r '.totalVisits // 0')
            SITE_LABEL="Site requests (24h)"
          else
            SITE_LABEL="Site requests (${DAYS_COLLECTED}d)"
          fi

          echo "::debug::Commits: $COMMIT_COUNT | Active repos: $ACTIVE_REPOS"
          echo "::debug::Site requests: $SITE_VISITS over $DAYS_COLLECTED days"
          echo "::debug::Latest commit: $LATEST_COMMIT_MSG"

          # --- Build Discord embed ---
          PAYLOAD=$(jq -n \
            --arg commits "$COMMIT_COUNT" \
            --arg most_active "$MOST_ACTIVE_REPO" \
            --arg repos "$ACTIVE_REPOS" \
            --arg pr_opened "$PR_OPENED" \
            --arg pr_merged "$PR_MERGED" \
            --arg issues_opened "$ISSUES_OPENED" \
            --arg issues_closed "$ISSUES_CLOSED" \
            --arg new_repos "$NEW_REPOS" \
            --arg busiest_day "$BUSIEST_DAY" \
            --arg latest_commit "$LATEST_COMMIT_MSG" \
            --arg stars "$TOTAL_STARS" \
            --arg public_repos "$PUBLIC_REPOS" \
            --arg followers "$FOLLOWERS" \
            --arg site_visits "$SITE_VISITS" \
            --arg site_label "$SITE_LABEL" \
            --arg top_page "$TOP_PAGE" \
            '{
              username: "weekly-digest",
              embeds: [{
                title: "Weekly Digest",
                description: "Activity across all repos (public + private) — past 7 days. Site traffic is request-based; scanner paths are filtered from the top page.",
                color: 16098851,
                fields: [
                  {name: "Commits (7d)", value: $commits, inline: true},
                  {name: "Most active repo", value: $most_active, inline: true},
                  {name: "Busiest day", value: $busiest_day, inline: true},
                  {name: "Pull requests (7d)", value: ($pr_opened + " opened · " + $pr_merged + " merged"), inline: true},
                  {name: "Issues (7d)", value: ($issues_opened + " opened · " + $issues_closed + " closed"), inline: true},
                  {name: "New repos (7d)", value: $new_repos, inline: true},
                  {name: "Total stars (all-time)", value: $stars, inline: true},
                  {name: "Public repos (all-time)", value: $public_repos, inline: true},
                  {name: "Followers", value: $followers, inline: true},
                  {name: $site_label, value: $site_visits, inline: true},
                  {name: "Top real page (24h)", value: $top_page, inline: true},
                  {name: "Active repos this week", value: $repos, inline: false},
                  {name: "Latest commit", value: ("\u201c" + $latest_commit + "\u201d"), inline: false}
                ],
                footer: {text: "Atlas Systems — Pipeline"}
              }]
            }')

          if [ -z "$PAYLOAD" ]; then
            echo "::error::jq failed to build payload — aborting"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.DISCORD_DIGEST_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::Digest posted to Discord (HTTP $HTTP_CODE)"
          else
            echo "::error::Discord webhook returned HTTP $HTTP_CODE"
            exit 1
          fi

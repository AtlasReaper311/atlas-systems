name: Weekly Digest

on:
  schedule:
    - cron: '0 18 * * 0'   # every Sunday, 18:00 UTC
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Build and post weekly digest
        env:
          GH_AUTH: "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
        run: |
          USERNAME="AtlasReaper311"
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          EVENTS=$(curl -s -H "$GH_AUTH" "https://api.github.com/users/$USERNAME/events/public?per_page=100")
          echo "$EVENTS" | jq empty 2>/dev/null || EVENTS='[]'

          USER_DATA=$(curl -s -H "$GH_AUTH" "https://api.github.com/users/$USERNAME")
          echo "$USER_DATA" | jq empty 2>/dev/null || USER_DATA='{}'

          REPOS_DATA=$(curl -s -H "$GH_AUTH" "https://api.github.com/users/$USERNAME/repos?per_page=100")
          echo "$REPOS_DATA" | jq empty 2>/dev/null || REPOS_DATA='[]'

          # --- Commits (7d): ground truth, not the events feed ---
          # GitHub's events feed marks a push's commits as "non-distinct"
          # (distinct_size: 0) when it judges them already visible from a
          # recent prior push to the same branch — exactly what a day of
          # rapid small commits looks like. Querying each repo's real
          # Commits endpoint directly, filtered to this account's own
          # authored commits (so a CI bot's auto-commits, like the
          # coverage badge updater, never get counted as yours), gives
          # the real number regardless of push frequency. Capped at 100
          # commits per repo per week via per_page; fine for a personal
          # account's actual volume, a known limit if that ever changes.
          REPO_NAMES=$(echo "$REPOS_DATA" | jq -r '.[] | select(.fork == false) | .name')
          COMMIT_COUNT=0
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            RESP=$(curl -s -H "$GH_AUTH" "https://api.github.com/repos/$USERNAME/$repo/commits?since=$SINCE&author=$USERNAME&per_page=100")
            COUNT=$(echo "$RESP" | jq 'if type=="array" then length else 0 end' 2>/dev/null || echo 0)
            COMMIT_COUNT=$((COMMIT_COUNT + COUNT))
          done <<< "$REPO_NAMES"

          REPO_LIST=$(echo "$EVENTS" | jq -r --arg since "$SINCE" '
            [.[] | select(.type=="PushEvent" and .created_at>=$since) | .repo.name] | unique | join(", ")
          ')
          [ -z "$REPO_LIST" ] && REPO_LIST="none this week"

          MOST_ACTIVE_REPO=$(echo "$EVENTS" | jq -r --arg since "$SINCE" '
            [.[] | select(.type=="PushEvent" and .created_at>=$since) | .repo.name]
            | group_by(.) | map({repo: .[0], count: length}) | sort_by(-.count) | .[0].repo // "none"
          ')

          BUSIEST_DAY=$(echo "$EVENTS" | jq -r --arg since "$SINCE" '
            [.[] | select(.type=="PushEvent" and .created_at>=$since)
                  | (.created_at | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime | strftime("%A"))]
            | group_by(.) | map({day: .[0], count: length}) | sort_by(-.count) | .[0].day // "—"
          ')

          PR_OPENED=$(echo "$EVENTS" | jq '
            [.[] | select(.type=="PullRequestEvent" and .created_at>='\""$SINCE"\"' and .payload.action=="opened")] | length
          ')
          PR_MERGED=$(echo "$EVENTS" | jq '
            [.[] | select(.type=="PullRequestEvent" and .created_at>='\""$SINCE"\"' and .payload.action=="closed" and .payload.pull_request.merged==true)] | length
          ')
          ISSUES_OPENED=$(echo "$EVENTS" | jq '
            [.[] | select(.type=="IssuesEvent" and .created_at>='\""$SINCE"\"' and .payload.action=="opened")] | length
          ')
          ISSUES_CLOSED=$(echo "$EVENTS" | jq '
            [.[] | select(.type=="IssuesEvent" and .created_at>='\""$SINCE"\"' and .payload.action=="closed")] | length
          ')

          # --- New repos (7d): ground truth via created_at, not CreateEvent ---
          # The events feed caps at the 100 most recent events; a day with
          # heavy push volume across many repos can scroll a morning's
          # CreateEvent clean off the list by evening. Every repo object
          # already carries a real created_at timestamp — filtering that
          # directly has no window to fall out of. Forks excluded, same
          # convention as github-pulse.
          NEW_REPOS=$(echo "$REPOS_DATA" | jq -r --arg since "$SINCE" '
            [.[] | select(.fork == false and .created_at >= $since) | .name] | join(", ")
          ')
          [ -z "$NEW_REPOS" ] && NEW_REPOS="none"

          LATEST_COMMIT_MSG=$(echo "$EVENTS" | jq -r --arg since "$SINCE" '
            ([.[] | select(.type=="PushEvent" and .created_at>=$since)] | sort_by(.created_at) | last) as $e
            | if $e then ($e.payload.commits[-1].message // "—") | split("\n")[0] else "—" end
          ')

          FOLLOWERS=$(echo "$USER_DATA" | jq -r '.followers // 0')
          PUBLIC_REPOS=$(echo "$USER_DATA" | jq -r '.public_repos // 0')
          TOTAL_STARS=$(echo "$REPOS_DATA" | jq '[.[].stargazers_count] | add // 0')

          SITE_PULSE=$(curl -s "https://api.atlas-systems.uk/site-pulse")
          echo "$SITE_PULSE" | jq empty 2>/dev/null || SITE_PULSE='{}'
          echo "DEBUG site-pulse raw response: $SITE_PULSE"
          SITE_VISITS=$(echo "$SITE_PULSE" | jq -r '.totalVisits // 0')
          TOP_PAGE=$(echo "$SITE_PULSE" | jq -r '.topPages[0].path // "—"')

          PAYLOAD=$(jq -n \
            --arg commits "$COMMIT_COUNT" \
            --arg most_active "$MOST_ACTIVE_REPO" \
            --arg repos "$REPO_LIST" \
            --arg pr_opened "$PR_OPENED" \
            --arg pr_merged "$PR_MERGED" \
            --arg issues_opened "$ISSUES_OPENED" \
            --arg issues_closed "$ISSUES_CLOSED" \
            --arg new_repos "$NEW_REPOS" \
            --arg busiest_day "$BUSIEST_DAY" \
            --arg latest_commit "$LATEST_COMMIT_MSG" \
            --arg stars "$TOTAL_STARS" \
            --arg public_repos "$PUBLIC_REPOS" \
            --arg followers "$FOLLOWERS" \
            --arg site_visits "$SITE_VISITS" \
            --arg top_page "$TOP_PAGE" \
            '{
              username: "atlas-notify",
              embeds: [{
                title: "Weekly Digest",
                description: "Activity across all public repos — past 7 days, plus all-time totals. Site stats are a 24h snapshot taken at digest time, not a rolling weekly total.",
                color: 16098851,
                fields: [
                  {name: "Commits (7d)", value: $commits, inline: true},
                  {name: "Most active repo", value: $most_active, inline: true},
                  {name: "Busiest day", value: $busiest_day, inline: true},
                  {name: "Pull requests (7d)", value: ($pr_opened + " opened · " + $pr_merged + " merged"), inline: true},
                  {name: "Issues (7d)", value: ($issues_opened + " opened · " + $issues_closed + " closed"), inline: true},
                  {name: "New repos (7d)", value: $new_repos, inline: true},
                  {name: "Total stars (all-time)", value: $stars, inline: true},
                  {name: "Public repos (all-time)", value: $public_repos, inline: true},
                  {name: "Followers", value: $followers, inline: true},
                  {name: "Site visits (24h)", value: $site_visits, inline: true},
                  {name: "Top page", value: $top_page, inline: true},
                  {name: "Active repos this week", value: $repos, inline: false},
                  {name: "Latest commit", value: ("\u201c" + $latest_commit + "\u201d"), inline: false}
                ],
                footer: {text: "Atlas Systems — Pipeline"}
              }]
            }')

          curl -X POST "${{ secrets.DISCORD_DIGEST_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

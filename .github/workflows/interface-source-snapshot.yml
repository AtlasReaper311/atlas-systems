name: Interface source snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/interface-source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    name: Capture exact branch source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Record source identity
        run: |
          set -euo pipefail
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > .atlas-snapshot-head
          git rev-parse HEAD^{tree} > .atlas-snapshot-tree

      - name: Package working tree
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "${RUNNER_TEMP}/atlas-systems-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-systems-interface-source
          path: ${{ runner.temp }}/atlas-systems-source.tar.gz
          if-no-files-found: error
          retention-days: 1

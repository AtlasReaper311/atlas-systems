name: Apply System Map card field integration

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/apply-system-map-card-field-integration.yml"
      - ".atlas/system-map-card-field-integration-trigger"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: feat/system-map-card-atlas-field
          fetch-depth: 0

      - name: Apply guarded integration patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lab = Path("lab/index.html")
          lab_source = lab.read_text(encoding="utf-8")
          css_anchor = '  <link rel="stylesheet" href="/static/css/card-signatures.css?v=20260724-card-signatures">\n'
          css_insert = css_anchor + '  <link rel="stylesheet" href="/lab/shared/system-map-card-field.css?v=20260727-system-map-card-field-v1">\n'
          script_anchor = '  <script type="module" src="/lab/shared/shell.js?v=20260723-interface-v2"></script>\n'
          script_insert = script_anchor + '  <script type="module" src="/lab/shared/system-map-card-field.js?v=20260727-system-map-card-field-v1"></script>\n'
          if lab_source.count(css_anchor) != 1 or lab_source.count(script_anchor) != 1:
              raise SystemExit("Lab integration anchors are not unique")
          lab_source = lab_source.replace(css_anchor, css_insert)
          lab_source = lab_source.replace(script_anchor, script_insert)
          lab.write_text(lab_source, encoding="utf-8")

          workflow = Path(".github/workflows/interface-preview.yml")
          workflow_source = workflow.read_text(encoding="utf-8")
          path_anchor = '      - "scripts/capture_interface_evidence.mjs"\n'
          path_insert = path_anchor + '      - "scripts/smoke_system_map_card_field_preview.mjs"\n'
          sparse_anchor = '            scripts/capture_batch_h_evidence.mjs\n'
          sparse_insert = sparse_anchor + '            scripts/smoke_system_map_card_field_preview.mjs\n'
          copy_anchor = '          cp scripts/capture_batch_h_evidence.mjs "${RUNNER_TEMP}/interface-evidence/"\n'
          copy_insert = copy_anchor + '          cp scripts/smoke_system_map_card_field_preview.mjs "${RUNNER_TEMP}/interface-evidence/"\n'
          capture_anchor = '      - name: Capture governed browser and viewport matrix\n'
          smoke_step = '''      - name: Verify System Map card AtlasField pixels
            working-directory: ${{ runner.temp }}/interface-evidence
            env:
              SYSTEM_MAP_FIELD_OUTPUT_DIR: ${{ runner.temp }}/interface-evidence/system-map-card-field-preview-smoke
            run: node smoke_system_map_card_field_preview.mjs
'''
          upload_anchor = '            ${{ runner.temp }}/interface-evidence/screenshots/*.png\n'
          upload_insert = upload_anchor + '            ${{ runner.temp }}/interface-evidence/system-map-card-field-preview-smoke/evidence.json\n            ${{ runner.temp }}/interface-evidence/system-map-card-field-preview-smoke/system-map-card-field-preview.png\n'
          anchors = [path_anchor, sparse_anchor, copy_anchor, capture_anchor, upload_anchor]
          if any(workflow_source.count(anchor) != 1 for anchor in anchors):
              raise SystemExit("Preview workflow integration anchors are not unique")
          workflow_source = workflow_source.replace(path_anchor, path_insert)
          workflow_source = workflow_source.replace(sparse_anchor, sparse_insert)
          workflow_source = workflow_source.replace(copy_anchor, copy_insert)
          workflow_source = workflow_source.replace(capture_anchor, smoke_step + capture_anchor)
          workflow_source = workflow_source.replace(upload_anchor, upload_insert)
          workflow.write_text(workflow_source, encoding="utf-8")

          Path(".github/workflows/apply-system-map-card-field-integration.yml").unlink()
          Path(".atlas/system-map-card-field-integration-trigger").unlink()
          PY

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "Atlas Systems Integration"
          git config user.email "actions@users.noreply.github.com"
          git add lab/index.html
          git add .github/workflows/interface-preview.yml
          git add .github/workflows/apply-system-map-card-field-integration.yml
          git add .atlas/system-map-card-field-integration-trigger
          git commit -m "Integrate System Map card field preview"
          git push origin HEAD:feat/system-map-card-atlas-field

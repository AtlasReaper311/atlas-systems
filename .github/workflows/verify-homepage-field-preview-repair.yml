name: Verify repaired homepage AtlasField preview

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/verify-homepage-field-preview-repair.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Wait for repaired preview identity
        env:
          PREVIEW_URL: https://interface-pr-149.atlas-systems-44t.pages.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL -H 'Cache-Control: no-cache' "${PREVIEW_URL}/?atlas-preview-wait=${attempt}" || true)"
            if printf '%s' "${body}" | grep -Fq '20260727-atlas-field-production-v2'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::repaired AtlasField preview identity did not become available"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install pinned browser tooling
        run: npm install --no-save --ignore-scripts playwright@1.61.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify visible animated AtlasField pixels
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          SITE_URL: https://interface-pr-149.atlas-systems-44t.pages.dev
          HOMEPAGE_FIELD_OUTPUT_DIR: ${{ runner.temp }}/homepage-atlas-field-preview-smoke
        run: node scripts/smoke_homepage_atlas_field_production.mjs

      - name: Upload preview repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homepage-atlas-field-preview-repair
          path: ${{ runner.temp }}/homepage-atlas-field-preview-smoke
          if-no-files-found: error
          retention-days: 1

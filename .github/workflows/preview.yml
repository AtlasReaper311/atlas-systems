name: System SYMPHONY featured lead repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/preview.yml"

permissions:
  contents: write

jobs:
  repair-featured-leads:
    name: Repair featured lead timing and balance
    if: github.event.pull_request.head.ref == 'feat/system-symphony-featured-leads'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/system-symphony-featured-leads
          fetch-depth: 0

      - name: Install audio tooling
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi

      - name: Apply and validate repair
        run: bash scripts/repair_featured_leads.sh

      - name: Commit repaired listening candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/audio/system-symphony
          git add static/js/sonify/samples.js
          git add static/js/sonify/sampler.js
          git add static/js/sonify/performance.js
          git add static/js/sonify/samples.test.js
          git commit -m "Fix featured lead timing and Unknown balance"
          git push origin HEAD:feat/system-symphony-featured-leads

name: System SYMPHONY concise validation diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/preview.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose exact validation failure
    if: github.event.pull_request.head.ref == 'feat/system-symphony-featured-leads'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run concise diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch feat/system-symphony-featured-leads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo

          run_stage() {
            label="$1"
            shift
            log="${RUNNER_TEMP}/${label}.log"
            echo "START ${label}"
            if "$@" >"${log}" 2>&1; then
              echo "PASS ${label}"
            else
              status=$?
              echo "FAIL ${label} status=${status}"
              tail -n 80 "${log}"
              exit "${status}"
            fi
          }

          run_stage html npx --yes html-validate@9.7.1 "**/*.html"
          run_stage tests node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          run_stage sitemap python3 scripts/generate_sitemap.py --check-only
          run_stage pages python3 scripts/verify_pages_output.py .

          echo "START json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY
          echo "PASS json"

name: Cloudflare Pages preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/preview.yml"
      - "_headers"
      - "lab/**"
      - "static/js/sonify/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-listening-tune:
    name: Apply listening tune
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/system-symphony-cache-transition-coherence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply listening tune
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit_segment(text, start_marker, end_marker, replacements):
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              segment = text[start:end]
              for old, new in replacements:
                  segment = segment.replace(old, new, 1)
              return text[:start] + segment + text[end:]

          engine_path = Path("static/js/sonify/engine.js")
          sampler_path = Path("static/js/sonify/sampler.js")
          ui_path = Path("static/js/sonify/ui.js")

          engine = engine_path.read_text(encoding="utf-8")
          sampler = sampler_path.read_text(encoding="utf-8")
          ui = ui_path.read_text(encoding="utf-8")

          engine = engine.replace(
              'const depth = scoreState === "critical" ? 0.74 : scoreState === "warning" ? 0.78 : 0.82;',
              'const depth = scoreState === "critical" ? 0.82 : scoreState === "warning" ? 0.86 : 0.84;',
          )
          engine = engine.replace(
              'parameter.linearRampToValueAtTime?.(1, time + 0.14);',
              'parameter.linearRampToValueAtTime?.(1, time + 0.12);',
          )

          engine = edit_segment(
              engine,
              '    terminalSynth = new Tone.FMSynth({',
              '    });',
              [
                  ('modulationIndex: 2.2,', 'modulationIndex: 1.6,'),
                  ('envelope: { attack: 0.006, decay: 0.16, sustain: 0.16, release: 0.38 },', 'envelope: { attack: 0.012, decay: 0.22, sustain: 0.2, release: 0.5 },'),
                  ('modulationEnvelope: { attack: 0.008, decay: 0.2, sustain: 0.08, release: 0.3 },', 'modulationEnvelope: { attack: 0.018, decay: 0.26, sustain: 0.06, release: 0.42 },'),
                  ('volume: -9,', 'volume: -8,'),
              ],
          )
          engine = engine.replace(
              '1.4 + (performance.intent?.tension ?? performance.grit ?? 0.5) * 3.2',
              '1.15 + (performance.intent?.tension ?? performance.grit ?? 0.5) * 2.0',
          )

          engine = edit_segment(
              engine,
              '    riffSynths = [',
              '    ];',
              [
                  ('oscillator: { type: "square" },', 'oscillator: { type: "triangle" },'),
                  ('envelope: { attack: 0.004, decay: 0.12, sustain: 0.12, release: 0.2 },', 'envelope: { attack: 0.01, decay: 0.18, sustain: 0.18, release: 0.32 },'),
                  ('volume: -14,', 'volume: -13,'),
                  ('modulationIndex: 3.1,', 'modulationIndex: 2.4,'),
                  ('modulation: { type: "square" },', 'modulation: { type: "sine" },'),
                  ('envelope: { attack: 0.003, decay: 0.14, sustain: 0.08, release: 0.24 },', 'envelope: { attack: 0.01, decay: 0.18, sustain: 0.12, release: 0.32 },'),
                  ('modulationEnvelope: { attack: 0.002, decay: 0.1, sustain: 0.03, release: 0.18 },', 'modulationEnvelope: { attack: 0.012, decay: 0.16, sustain: 0.04, release: 0.26 },'),
                  ('volume: -15,', 'volume: -14,'),
                  ('volume: -16,', 'volume: -15,'),
                  ('envelope: { attack: 0.006, decay: 0.16, sustain: 0.1, release: 0.28 },', 'envelope: { attack: 0.01, decay: 0.2, sustain: 0.14, release: 0.34 },'),
                  ('modulationEnvelope: { attack: 0.004, decay: 0.12, sustain: 0.05, release: 0.2 },', 'modulationEnvelope: { attack: 0.008, decay: 0.16, sustain: 0.05, release: 0.26 },'),
              ],
          )

          engine = engine.replace('        * (performance?.drumMultiplier ?? 1)\n', '')
          engine = engine.replace(
              '(frame.scoreState === "critical" ? 0.14 : frame.scoreState === "warning" ? 0.11 : frame.scoreState === "unknown" ? 0.04 : 0.08)\n          * phaseMix.drums,',
              '(frame.scoreState === "critical" ? 0.1 : frame.scoreState === "warning" ? 0.08 : frame.scoreState === "unknown" ? 0.035 : 0.07)\n          * phaseMix.drums\n          * ghostMix.backing,',
          )
          engine = engine.replace(
              '(performance?.terminalGain ?? 0)\n          * terminalStateMultiplier',
              '(performance?.terminalGain ?? 0)\n          * 1.18\n          * terminalStateMultiplier',
          )
          engine = engine.replace(
              '(performance?.riffGain ?? 0) * phaseMix.riff * ghostMix.riff,',
              '(performance?.riffGain ?? 0) * 1.2 * phaseMix.riff * ghostMix.riff,',
          )

          sampler = sampler.replace('const ATMOSPHERE_XFADE_SECONDS = 4;', 'const ATMOSPHERE_XFADE_SECONDS = 3;')
          sampler = sampler.replace('lead: 0.58', 'lead: 0.64', 1)
          sampler = sampler.replace('lead: 0.28', 'lead: 0.42', 1)
          sampler = sampler.replace(
              'const leadMultiplier = performance && (phaseMix.riff > 0 || ghostModeActive)\n      ? ghostMix.lead\n      : 1;',
              'const leadMultiplier = performance && (phaseMix.riff > 0 || ghostModeActive)\n      ? ghostModeActive\n        ? ghostMix.lead\n        : Math.max(0.9, ghostMix.lead)\n      : 1;',
          )
          sampler = edit_segment(
              sampler,
              '    ramp(\n      drumBus.gain,',
              '    );',
              [
                  ('\n        * phaseMix.drums', ''),
                  ('\n        * ghostMix.backing', ''),
              ],
          )

          ui = edit_segment(
              ui,
              '    const result = engine.setScene(audible, performanceArrangement, {',
              '    });',
              [
                  ('quantize: engine.isRunning(),', 'quantize: engine.isRunning(),\n      transitionSeconds: 2,'),
              ],
          )
          ui = ui.replace('smooth 4-second crossfade', 'smooth 2-second crossfade')

          engine_path.write_text(engine, encoding="utf-8")
          sampler_path.write_text(sampler, encoding="utf-8")
          ui_path.write_text(ui, encoding="utf-8")
          PY

          node --check static/js/sonify/engine.js
          node --check static/js/sonify/sampler.js
          node --check static/js/sonify/ui.js
          git diff --check

          if git diff --quiet; then
            echo "Listening tune already present; no commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/sonify/engine.js
          git add static/js/sonify/sampler.js
          git add static/js/sonify/ui.js
          git diff --cached --check
          git commit -m "Tune System SYMPHONY mix and Demo transitions"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

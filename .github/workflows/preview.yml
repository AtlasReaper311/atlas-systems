name: System SYMPHONY full validation diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/preview.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose full validation
    if: github.event.pull_request.head.ref == 'feat/system-symphony-featured-leads'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/system-symphony-featured-leads
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run validation with stage markers
        run: |
          set -euo pipefail
          echo "VALIDATION 1/5: HTML"
          npx --yes html-validate@9.7.1 "**/*.html"
          echo "VALIDATION 2/5: NODE TESTS"
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          echo "VALIDATION 3/5: SITEMAP"
          python3 scripts/generate_sitemap.py --check-only
          echo "VALIDATION 4/5: PAGES OUTPUT"
          python3 scripts/verify_pages_output.py .
          echo "VALIDATION 5/5: JSON"
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY
          echo "VALIDATION COMPLETE"

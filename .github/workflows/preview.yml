name: Cloudflare Pages preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/preview.yml"
      - "_headers"
      - "lab/**"
      - "scripts/run_system_symphony_production_loudness.mjs"
      - "scripts/smoke_system_symphony_preview.mjs"
      - "scripts/smoke_system_symphony_apu_preview.mjs"
      - "scripts/smoke_system_symphony_apu_hybrid.mjs"
      - "scripts/smoke_system_symphony_production_loudness.mjs"
      - "scripts/system-symphony-production-evidence.mjs"
      - "static/js/sonify/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate preview candidate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'feat/system-symphony-') ||
       startsWith(github.event.pull_request.head.ref, 'fix/system-symphony-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate HTML
        run: npx --yes html-validate@9.7.1 "**/*.html"

      - name: Run public interface tests
        run: node --test js/tests/public-interface-contract.test.mjs

      - name: Run remaining main-site tests
        id: main-site
        continue-on-error: true
        run: |
          set -o pipefail
          files=()
          for path in js/tests/*.test.mjs; do
            if [ "${path}" != "js/tests/public-interface-contract.test.mjs" ]; then
              files+=("${path}")
            fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            node --test --test-concurrency=1 "${files[@]}" 2>&1 | tee preview-main-site-test-report.txt
          else
            printf '%s\n' 'No remaining main-site tests found.' | tee preview-main-site-test-report.txt
          fi

      - name: Upload preview main-site test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: preview-main-site-test-report
          path: preview-main-site-test-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce preview main-site test result
        if: steps.main-site.outcome != 'success'
        run: |
          cat preview-main-site-test-report.txt
          exit 1

      - name: Run Lab tests
        run: node --test lab/tests/*.test.mjs

      - name: Run System Symphony tests
        run: node --test static/js/sonify/*.test.js

      - name: Validate static site and Pages output
        run: |
          set -euo pipefail
          python3 scripts/generate_sitemap.py --check-only
          python3 scripts/verify_pages_output.py .
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Check repository links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments --root-dir ${{ github.workspace }} ."
          fail: true

  deploy-preview:
    name: Publish and verify branch preview
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'feat/system-symphony-') ||
       startsWith(github.event.pull_request.head.ref, 'fix/system-symphony-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: pages-preview
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      PAGES_BRANCH: system-symphony-pr-${{ github.event.pull_request.number }}
      PROJECT_NAME: atlas-systems
    steps:
      - name: Check out validated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Guard production boundary
        run: |
          set -euo pipefail
          case "${SOURCE_BRANCH}" in
            feat/system-symphony-*|fix/system-symphony-*) ;;
            *) echo "Refusing unexpected preview source branch: ${SOURCE_BRANCH}" >&2; exit 1 ;;
          esac
          test "${SOURCE_BRANCH}" != "main"
          test "${PAGES_BRANCH}" != "main"

      - name: Prepare filtered Pages publish artifact
        run: bash scripts/prepare_pages_publish.sh "${RUNNER_TEMP}/pages-publish"

      - name: Deploy preview with Wrangler
        id: deploy
        env:
          PUBLISH_DIRECTORY: ${{ runner.temp }}/pages-publish
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/wrangler-pages-deploy.log"
          npx --yes wrangler@4.109.0 pages deploy "${PUBLISH_DIRECTORY}" \
            --project-name "${PROJECT_NAME}" \
            --branch "${PAGES_BRANCH}" \
            --commit-dirty=true 2>&1 | tee "${output_file}"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "${output_file}" | tail -n 1)"
          test -n "${deployment_url}"
          echo "deployment_url=${deployment_url}" >>"${GITHUB_OUTPUT}"

      - name: Install pinned browser smoke tooling
        run: npm install --no-save --ignore-scripts playwright@1.61.1

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Verify current System Symphony live data and audio
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/system-symphony-smoke
        run: node scripts/smoke_system_symphony_preview.mjs

      - name: Verify hybrid Atlas APU in Chromium
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
          APU_BROWSER: chromium
          APU_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/system-symphony-apu-smoke/chromium
        run: node scripts/smoke_system_symphony_apu_hybrid.mjs

      - name: Verify aligned production loudness proof in Chromium
        env:
          SITE_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          SYMPHONY_PRODUCTION_OUTPUT_DIR: ${{ runner.temp }}/system-symphony-production-loudness-preview
        run: node scripts/smoke_system_symphony_production_loudness.mjs

      - name: Verify hybrid Atlas APU in Firefox
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
          APU_BROWSER: firefox
          APU_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/system-symphony-apu-smoke/firefox
        run: |
          set -euo pipefail
          if ! command -v pulseaudio >/dev/null 2>&1 || ! command -v pactl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y pulseaudio pulseaudio-utils
          fi
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/atlas-pulse-runtime"
          mkdir -p "${XDG_RUNTIME_DIR}"
          chmod 700 "${XDG_RUNTIME_DIR}"
          pulseaudio --daemonize=yes --exit-idle-time=-1 --log-target=stderr
          export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"
          trap 'pulseaudio --kill >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5; do
            if pactl info >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          pactl info >/dev/null
          pactl load-module module-null-sink sink_name=atlas_ci sink_properties=device.description=AtlasCI >/dev/null
          pactl set-default-sink atlas_ci
          node scripts/smoke_system_symphony_apu_hybrid.mjs

      - name: Upload current System Symphony smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: system-symphony-preview-smoke
          path: ${{ runner.temp }}/system-symphony-smoke
          if-no-files-found: error
          retention-days: 7

      - name: Upload hybrid Atlas APU smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: system-symphony-apu-hybrid-smoke
          path: ${{ runner.temp }}/system-symphony-apu-smoke
          if-no-files-found: error
          retention-days: 7

      - name: Upload aligned production loudness preview evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: system-symphony-production-loudness-preview
          path: ${{ runner.temp }}/system-symphony-production-loudness-preview
          if-no-files-found: error
          retention-days: 7

      - name: Record branch preview alias
        env:
          ATOMIC_URL: ${{ steps.deploy.outputs.deployment_url }}
          PREVIEW_URL: https://system-symphony-pr-${{ github.event.pull_request.number }}.atlas-systems-44t.pages.dev
        run: |
          set -euo pipefail
          {
            echo "## Cloudflare Pages preview"
            echo
            echo "Current instrument: ${PREVIEW_URL}/lab/system-symphony/"
            echo
            echo "Hybrid Atlas APU candidate: ${PREVIEW_URL}/lab/system-symphony-apu/"
            echo
            echo "Atomic deployment: ${ATOMIC_URL}"
            echo
            echo "Browser smoke verified the current production-comparison route, the aligned 32-bar production loudness proof, and the hybrid Atlas APU in Chromium and Firefox. The APU checks require a running Tone.js context, explicit fixture evidence states, a mixed state vector, per-state loudness measurements, six channel cards and zero audio asset requests."
            echo
            echo "This is a non-production branch deployment. atlas-systems.uk is unchanged."
          } >>"${GITHUB_STEP_SUMMARY}"

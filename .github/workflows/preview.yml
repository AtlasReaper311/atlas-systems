name: System SYMPHONY test failure diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/preview.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Identify failing Node assertion
    if: github.event.pull_request.head.ref == 'feat/system-symphony-featured-leads'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Extract failure only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch feat/system-symphony-featured-leads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          log="${RUNNER_TEMP}/tests.log"
          set +e
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js >"${log}" 2>&1
          status=$?
          set -e
          echo "TEST_STATUS=${status}"
          grep -n -E -B 8 -A 22 'not ok|failureType:|AssertionError|ERR_ASSERTION|error:' "${log}" | head -n 180 || true
          exit "${status}"

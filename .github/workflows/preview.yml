name: Cloudflare Pages preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/preview.yml"
      - "_headers"
      - "lab/**"
      - "static/js/sonify/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-listening-tune:
    name: Apply listening tune
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/system-symphony-cache-transition-coherence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply listening tune
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"REFUSING PATCH: {label} expected once, found {count}")
              return text.replace(old, new, 1)

          def replace_count(text, old, new, expected, label):
              if text.count(new) == expected:
                  return text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"REFUSING PATCH: {label} expected {expected}, found {count}")
              return text.replace(old, new)

          engine_path = Path("static/js/sonify/engine.js")
          sampler_path = Path("static/js/sonify/sampler.js")
          ui_path = Path("static/js/sonify/ui.js")

          engine = engine_path.read_text(encoding="utf-8")
          sampler = sampler_path.read_text(encoding="utf-8")
          ui = ui_path.read_text(encoding="utf-8")

          engine = replace_once(
              engine,
              'const depth = scoreState === "critical" ? 0.74 : scoreState === "warning" ? 0.78 : 0.82;',
              'const depth = scoreState === "critical" ? 0.82 : scoreState === "warning" ? 0.86 : 0.84;',
              "sidechain depth",
          )
          engine = replace_once(
              engine,
              'parameter.linearRampToValueAtTime?.(1, time + 0.14);',
              'parameter.linearRampToValueAtTime?.(1, time + 0.12);',
              "sidechain release",
          )

          terminal_block = '''    terminalSynth = new Tone.FMSynth({
                harmonicity: 1.5,
                modulationIndex: 1.6,
                oscillator: { type: "sine" },
                modulation: { type: "triangle" },
                envelope: { attack: 0.012, decay: 0.22, sustain: 0.2, release: 0.5 },
                modulationEnvelope: { attack: 0.018, decay: 0.26, sustain: 0.06, release: 0.42 },
                volume: -8,
              });'''
          terminal_pattern = r'    terminalSynth = new Tone\.FMSynth\(\{\n.*?\n    \}\);'
          if terminal_block not in engine:
              engine, count = re.subn(terminal_pattern, terminal_block, engine, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"REFUSING PATCH: terminal synth block expected once, found {count}")

          engine = replace_count(
              engine,
              '1.4 + (performance.intent?.tension ?? performance.grit ?? 0.5) * 3.2',
              '1.15 + (performance.intent?.tension ?? performance.grit ?? 0.5) * 2.0',
              2,
              "terminal modulation index",
          )

          riff_block = '''    riffSynths = [
                new Tone.Synth({
                  oscillator: { type: "triangle" },
                  envelope: { attack: 0.01, decay: 0.18, sustain: 0.18, release: 0.32 },
                  volume: -13,
                }),
                new Tone.FMSynth({
                  harmonicity: 2.01,
                  modulationIndex: 2.4,
                  oscillator: { type: "triangle" },
                  modulation: { type: "sine" },
                  envelope: { attack: 0.01, decay: 0.18, sustain: 0.12, release: 0.32 },
                  modulationEnvelope: { attack: 0.012, decay: 0.16, sustain: 0.04, release: 0.26 },
                  volume: -15,
                }),
                new Tone.AMSynth({
                  harmonicity: 1.5,
                  oscillator: { type: "sawtooth" },
                  modulation: { type: "sine" },
                  envelope: { attack: 0.01, decay: 0.2, sustain: 0.14, release: 0.34 },
                  modulationEnvelope: { attack: 0.008, decay: 0.16, sustain: 0.05, release: 0.26 },
                  volume: -14,
                }),
              ];'''
          riff_pattern = r'    riffSynths = \[\n.*?\n    \];'
          if riff_block not in engine:
              engine, count = re.subn(riff_pattern, riff_block, engine, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"REFUSING PATCH: riff synth block expected once, found {count}")

          engine = replace_once(
              engine,
              '''    ramp(
                percussionGain.gain,
                (PERCUSSION_BUS_GAINS[frame.scoreState] ?? 0)
                  * (performance?.drumMultiplier ?? 1)
                  * phaseMix.drums
                  * ghostMix.backing,
              );''',
              '''    ramp(
                percussionGain.gain,
                (PERCUSSION_BUS_GAINS[frame.scoreState] ?? 0)
                  * phaseMix.drums
                  * ghostMix.backing,
              );''',
              "percussion bus multiplier",
          )
          engine = replace_once(
              engine,
              '''(frame.scoreState === "critical" ? 0.14 : frame.scoreState === "warning" ? 0.11 : frame.scoreState === "unknown" ? 0.04 : 0.08)
                  * phaseMix.drums,''',
              '''(frame.scoreState === "critical" ? 0.1 : frame.scoreState === "warning" ? 0.08 : frame.scoreState === "unknown" ? 0.035 : 0.07)
                  * phaseMix.drums
                  * ghostMix.backing,''',
              "parallel drum return",
          )
          engine = replace_once(
              engine,
              '''(performance?.terminalGain ?? 0)
                  * terminalStateMultiplier
                  * phaseMix.arp
                  * ghostMix.arp,''',
              '''(performance?.terminalGain ?? 0)
                  * 1.18
                  * terminalStateMultiplier
                  * phaseMix.arp
                  * ghostMix.arp,''',
              "arp bus gain",
          )
          engine = replace_once(
              engine,
              '(performance?.riffGain ?? 0) * phaseMix.riff * ghostMix.riff,',
              '(performance?.riffGain ?? 0) * 1.2 * phaseMix.riff * ghostMix.riff,',
              "riff bus gain",
          )

          sampler = replace_once(
              sampler,
              'const ATMOSPHERE_XFADE_SECONDS = 4;',
              'const ATMOSPHERE_XFADE_SECONDS = 3;',
              "atmosphere crossfade",
          )
          sampler = replace_once(sampler, 'lead: 0.58', 'lead: 0.64', "healthy lead gain")
          sampler = replace_once(sampler, 'lead: 0.28', 'lead: 0.42', "warning lead gain")
          sampler = replace_once(
              sampler,
              '''    const leadMultiplier = performance && (phaseMix.riff > 0 || ghostModeActive)
                ? ghostMix.lead
                : 1;''',
              '''    const leadMultiplier = performance && (phaseMix.riff > 0 || ghostModeActive)
                ? ghostModeActive
                  ? ghostMix.lead
                  : Math.max(0.9, ghostMix.lead)
                : 1;''',
              "normal lead priority",
          )
          sampler = replace_once(
              sampler,
              '''    ramp(
                drumBus.gain,
                mix.drums
                  * (0.76 + energy * 0.24)
                  * phaseMix.drums
                  * ghostMix.backing,
              );''',
              '''    ramp(
                drumBus.gain,
                mix.drums
                  * (0.76 + energy * 0.24),
              );''',
              "sample drum phase scaling",
          )

          ui = replace_once(
              ui,
              '''    const result = engine.setScene(audible, performanceArrangement, {
                quantize: engine.isRunning(),
              });''',
              '''    const result = engine.setScene(audible, performanceArrangement, {
                quantize: engine.isRunning(),
                transitionSeconds: 2,
              });''',
              "scene transition duration",
          )
          ui = replace_once(
              ui,
              'smooth 4-second crossfade',
              'smooth 2-second crossfade',
              "scene transition status",
          )

          engine_path.write_text(engine, encoding="utf-8")
          sampler_path.write_text(sampler, encoding="utf-8")
          ui_path.write_text(ui, encoding="utf-8")
          PY

          node --check static/js/sonify/engine.js
          node --check static/js/sonify/sampler.js
          node --check static/js/sonify/ui.js
          git diff --check

          if git diff --quiet; then
            echo "Listening tune already present; no commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/sonify/engine.js
          git add static/js/sonify/sampler.js
          git add static/js/sonify/ui.js
          git diff --cached --check
          git commit -m "Tune System SYMPHONY mix and Demo transitions"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

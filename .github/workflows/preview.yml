name: Cloudflare Pages preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/preview.yml"
      - "_headers"
      - "lab/**"
      - "static/js/sonify/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-listening-tune:
    name: Apply listening tune
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/system-symphony-cache-transition-coherence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Patch and validate listening tune
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"REFUSING PATCH: expected {expected} occurrence(s) in {path}, found {count}\n"
                      f"Anchor:\n{old}"
                  )
              path.write_text(text.replace(old, new, expected), encoding="utf-8")

          engine = Path("static/js/sonify/engine.js")
          sampler = Path("static/js/sonify/sampler.js")
          ui = Path("static/js/sonify/ui.js")

          engine_text = engine.read_text(encoding="utf-8")
          ui_text = ui.read_text(encoding="utf-8")
          if (
              'const depth = scoreState === "critical" ? 0.82 : scoreState === "warning" ? 0.86 : 0.84;' in engine_text
              and 'transitionSeconds: 2,' in ui_text
          ):
              print("PASS: listening tune already present")
              raise SystemExit(0)

          replace_exact(
              engine,
              '    const depth = scoreState === "critical" ? 0.74 : scoreState === "warning" ? 0.78 : 0.82;',
              '    const depth = scoreState === "critical" ? 0.82 : scoreState === "warning" ? 0.86 : 0.84;',
          )
          replace_exact(
              engine,
              '    parameter.linearRampToValueAtTime?.(1, time + 0.14);',
              '    parameter.linearRampToValueAtTime?.(1, time + 0.12);',
          )
          replace_exact(
              engine,
              '''    terminalSynth = new Tone.FMSynth({
                harmonicity: 1.5,
                modulationIndex: 2.2,
                oscillator: { type: "sine" },
                modulation: { type: "triangle" },
                envelope: { attack: 0.006, decay: 0.16, sustain: 0.16, release: 0.38 },
                modulationEnvelope: { attack: 0.008, decay: 0.2, sustain: 0.08, release: 0.3 },
                volume: -9,
              });''',
              '''    terminalSynth = new Tone.FMSynth({
                harmonicity: 1.5,
                modulationIndex: 1.6,
                oscillator: { type: "sine" },
                modulation: { type: "triangle" },
                envelope: { attack: 0.012, decay: 0.22, sustain: 0.2, release: 0.5 },
                modulationEnvelope: { attack: 0.018, decay: 0.26, sustain: 0.06, release: 0.42 },
                volume: -8,
              });''',
          )
          replace_exact(
              engine,
              '1.4 + (performance.intent?.tension ?? performance.grit ?? 0.5) * 3.2',
              '1.15 + (performance.intent?.tension ?? performance.grit ?? 0.5) * 2.0',
              expected=2,
          )
          replace_exact(
              engine,
              '''    riffSynths = [
                new Tone.Synth({
                  oscillator: { type: "square" },
                  envelope: { attack: 0.004, decay: 0.12, sustain: 0.12, release: 0.2 },
                  volume: -14,
                }),
                new Tone.FMSynth({
                  harmonicity: 2.01,
                  modulationIndex: 3.1,
                  oscillator: { type: "triangle" },
                  modulation: { type: "square" },
                  envelope: { attack: 0.003, decay: 0.14, sustain: 0.08, release: 0.24 },
                  modulationEnvelope: { attack: 0.002, decay: 0.1, sustain: 0.03, release: 0.18 },
                  volume: -16,
                }),
                new Tone.AMSynth({
                  harmonicity: 1.5,
                  oscillator: { type: "sawtooth" },
                  modulation: { type: "sine" },
                  envelope: { attack: 0.006, decay: 0.16, sustain: 0.1, release: 0.28 },
                  modulationEnvelope: { attack: 0.004, decay: 0.12, sustain: 0.05, release: 0.2 },
                  volume: -15,
                }),
              ];''',
              '''    riffSynths = [
                new Tone.Synth({
                  oscillator: { type: "triangle" },
                  envelope: { attack: 0.01, decay: 0.18, sustain: 0.18, release: 0.32 },
                  volume: -13,
                }),
                new Tone.FMSynth({
                  harmonicity: 2.01,
                  modulationIndex: 2.4,
                  oscillator: { type: "triangle" },
                  modulation: { type: "sine" },
                  envelope: { attack: 0.01, decay: 0.18, sustain: 0.12, release: 0.32 },
                  modulationEnvelope: { attack: 0.012, decay: 0.16, sustain: 0.04, release: 0.26 },
                  volume: -15,
                }),
                new Tone.AMSynth({
                  harmonicity: 1.5,
                  oscillator: { type: "sawtooth" },
                  modulation: { type: "sine" },
                  envelope: { attack: 0.01, decay: 0.2, sustain: 0.14, release: 0.34 },
                  modulationEnvelope: { attack: 0.008, decay: 0.16, sustain: 0.05, release: 0.26 },
                  volume: -14,
                }),
              ];''',
          )
          replace_exact(
              engine,
              '''    ramp(
                percussionGain.gain,
                (PERCUSSION_BUS_GAINS[frame.scoreState] ?? 0)
                  * (performance?.drumMultiplier ?? 1)
                  * phaseMix.drums
                  * ghostMix.backing,
              );''',
              '''    ramp(
                percussionGain.gain,
                (PERCUSSION_BUS_GAINS[frame.scoreState] ?? 0)
                  * phaseMix.drums
                  * ghostMix.backing,
              );''',
          )
          replace_exact(
              engine,
              '''        (frame.scoreState === "critical" ? 0.14 : frame.scoreState === "warning" ? 0.11 : frame.scoreState === "unknown" ? 0.04 : 0.08)
                  * phaseMix.drums,''',
              '''        (frame.scoreState === "critical" ? 0.1 : frame.scoreState === "warning" ? 0.08 : frame.scoreState === "unknown" ? 0.035 : 0.07)
                  * phaseMix.drums
                  * ghostMix.backing,''',
          )
          replace_exact(
              engine,
              '''        (performance?.terminalGain ?? 0)
                  * terminalStateMultiplier
                  * phaseMix.arp
                  * ghostMix.arp,''',
              '''        (performance?.terminalGain ?? 0)
                  * 1.18
                  * terminalStateMultiplier
                  * phaseMix.arp
                  * ghostMix.arp,''',
          )
          replace_exact(
              engine,
              '        (performance?.riffGain ?? 0) * phaseMix.riff * ghostMix.riff,',
              '        (performance?.riffGain ?? 0) * 1.2 * phaseMix.riff * ghostMix.riff,',
          )

          replace_exact(sampler, 'const ATMOSPHERE_XFADE_SECONDS = 4;', 'const ATMOSPHERE_XFADE_SECONDS = 3;')
          replace_exact(
              sampler,
              'healthy: Object.freeze({ drums: 0.68, bass: 0.62, bassLoop: 0.32, bassFilterHz: 720, lead: 0.58, atmosphere: 0.2, atmosphereFilterHz: 2300, drive: 0.025, room: 0.08, delay: 0.12 })',
              'healthy: Object.freeze({ drums: 0.68, bass: 0.62, bassLoop: 0.32, bassFilterHz: 720, lead: 0.64, atmosphere: 0.2, atmosphereFilterHz: 2300, drive: 0.025, room: 0.08, delay: 0.12 })',
          )
          replace_exact(
              sampler,
              'warning: Object.freeze({ drums: 0.72, bass: 0.64, bassLoop: 0.18, bassFilterHz: 860, lead: 0.28, atmosphere: 0.14, atmosphereFilterHz: 1150, drive: 0.04, room: 0.08, delay: 0.08 })',
              'warning: Object.freeze({ drums: 0.72, bass: 0.64, bassLoop: 0.18, bassFilterHz: 860, lead: 0.42, atmosphere: 0.14, atmosphereFilterHz: 1150, drive: 0.04, room: 0.08, delay: 0.08 })',
          )
          replace_exact(
              sampler,
              '''    const leadMultiplier = performance && (phaseMix.riff > 0 || ghostModeActive)
                ? ghostMix.lead
                : 1;''',
              '''    const leadMultiplier = performance && (phaseMix.riff > 0 || ghostModeActive)
                ? ghostModeActive
                  ? ghostMix.lead
                  : Math.max(0.9, ghostMix.lead)
                : 1;''',
          )
          replace_exact(
              sampler,
              '''    ramp(
                drumBus.gain,
                mix.drums
                  * (0.76 + energy * 0.24)
                  * phaseMix.drums
                  * ghostMix.backing,
              );''',
              '''    ramp(
                drumBus.gain,
                mix.drums
                  * (0.76 + energy * 0.24),
              );''',
          )

          replace_exact(
              ui,
              '''    const result = engine.setScene(audible, performanceArrangement, {
                quantize: engine.isRunning(),
              });''',
              '''    const result = engine.setScene(audible, performanceArrangement, {
                quantize: engine.isRunning(),
                transitionSeconds: 2,
              });''',
          )
          replace_exact(
              ui,
              '? `${action} queued for next bar // smooth 4-second crossfade // ${performanceSeed}`',
              '? `${action} queued for next bar // smooth 2-second crossfade // ${performanceSeed}`',
          )
          PY

          if git diff --quiet; then
            echo "Listening tune already present; no source commit needed."
            exit 0
          fi

          node --check static/js/sonify/engine.js
          node --check static/js/sonify/ghost-circuit.js
          node --check static/js/sonify/mapping.js
          node --check static/js/sonify/poller.js
          node --check static/js/sonify/sampler.js
          node --check static/js/sonify/samples.js
          node --check static/js/sonify/ui.js
          npx --yes html-validate@9.7.1 "**/*.html"
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          python3 scripts/generate_sitemap.py --check-only
          python3 scripts/verify_pages_output.py .
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/sonify/engine.js
          git add static/js/sonify/sampler.js
          git add static/js/sonify/ui.js
          git diff --cached --check
          git commit -m "Tune System SYMPHONY mix and Demo transitions"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  validate:
    name: Validate preview candidate
    needs: apply-listening-tune
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'feat/system-symphony-') ||
       startsWith(github.event.pull_request.head.ref, 'fix/system-symphony-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate static site and Pages output
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 "**/*.html"
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          python3 scripts/generate_sitemap.py --check-only
          python3 scripts/verify_pages_output.py .
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Check repository links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments --root-dir ${{ github.workspace }} ."
          fail: true

  deploy-preview:
    name: Publish branch preview
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'feat/system-symphony-') ||
       startsWith(github.event.pull_request.head.ref, 'fix/system-symphony-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pages-preview
      url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      PAGES_BRANCH: system-symphony-pr-${{ github.event.pull_request.number }}
      PROJECT_NAME: atlas-systems
    steps:
      - name: Check out validated head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Guard production boundary
        run: |
          set -euo pipefail
          case "${SOURCE_BRANCH}" in
            feat/system-symphony-*|fix/system-symphony-*) ;;
            *) echo "Refusing unexpected preview source branch: ${SOURCE_BRANCH}" >&2; exit 1 ;;
          esac
          test "${SOURCE_BRANCH}" != "main"
          test "${PAGES_BRANCH}" != "main"

      - name: Deploy preview with Wrangler
        id: deploy
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/wrangler-pages-deploy.log"
          npx --yes wrangler@4.109.0 pages deploy . \
            --project-name "${PROJECT_NAME}" \
            --branch "${PAGES_BRANCH}" \
            --commit-dirty=true 2>&1 | tee "${output_file}"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "${output_file}" | tail -n 1)"
          test -n "${deployment_url}"
          echo "deployment_url=${deployment_url}" >>"${GITHUB_OUTPUT}"

      - name: Record branch preview alias
        env:
          ATOMIC_URL: ${{ steps.deploy.outputs.deployment_url }}
          PREVIEW_URL: https://system-symphony-pr-${{ github.event.pull_request.number }}.atlas-systems-44t.pages.dev
        run: |
          set -euo pipefail
          {
            echo "## Cloudflare Pages preview"
            echo
            echo "${PREVIEW_URL}"
            echo
            echo "Atomic deployment: ${ATOMIC_URL}"
            echo
            echo "This is a non-production branch deployment. atlas-systems.uk is unchanged."
          } >>"${GITHUB_STEP_SUMMARY}"

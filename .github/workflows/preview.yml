name: System SYMPHONY featured lead repair diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/preview.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose featured lead repair script
    if: github.event.pull_request.head.ref == 'feat/system-symphony-featured-leads'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run repair script in disposable clone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          git clone --quiet --branch feat/system-symphony-featured-leads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          bash scripts/repair_featured_leads.sh

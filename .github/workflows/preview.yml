name: System SYMPHONY featured lead repair diagnostics

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/preview.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose featured lead repair
    if: github.event.pull_request.head.ref == 'feat/system-symphony-featured-leads'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run concise repair diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch feat/system-symphony-featured-leads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo

          echo "STEP 1: tools"
          command -v ffmpeg
          command -v ffprobe

          echo "STEP 2: source files"
          test -s static/audio/system-symphony/lead-geneticist-96-e-min.wav
          test -s static/audio/system-symphony/lead-no-alternative-100-e-min.wav

          echo "STEP 3: Geneticist render"
          ffmpeg -hide_banner -loglevel error -y \
            -i static/audio/system-symphony/lead-geneticist-96-e-min.wav \
            -af "asetrate=46722.32246124493,aresample=44100,atempo=0.9832024090434307" \
            -ar 44100 -ac 2 -c:a pcm_s16le /tmp/geneticist.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/geneticist.wav

          echo "STEP 4: No Alternative render"
          ffmpeg -hide_banner -loglevel error -y \
            -i static/audio/system-symphony/lead-no-alternative-100-e-min.wav \
            -af "asetrate=46722.32246124493,aresample=44100,atempo=0.9438743126816934" \
            -ar 44100 -ac 2 -c:a pcm_s16le /tmp/no-alternative.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/no-alternative.wav

          echo "STEP 5: encoders"
          ffmpeg -hide_banner -loglevel error -y -i /tmp/geneticist.wav -c:a libopus -b:a 160k /tmp/geneticist.opus
          ffmpeg -hide_banner -loglevel error -y -i /tmp/geneticist.wav -c:a aac -b:a 192k /tmp/geneticist.m4a

          echo "STEP 6: patch anchors"
          python3 - <<'PY'
          from pathlib import Path

          checks = [
              (Path("static/js/sonify/samples.js"), 'export const SAMPLE_ASSET_VERSION = "20260720-system-symphony-loop-production-v2";'),
              (Path("static/js/sonify/samples.js"), '...asset("geneticist", "lead-geneticist-96-e-min", -8),'),
              (Path("static/js/sonify/samples.js"), '...asset("no-alternative", "lead-no-alternative-100-e-min", -7),'),
              (Path("static/js/sonify/samples.js"), '  healthy: Object.freeze([0, 8, 16, 24]),\n  warning: Object.freeze([0, 16]),\n  critical: Object.freeze([0, 8, 16, 24]),\n  unknown: Object.freeze([0, 16]),'),
              (Path("static/js/sonify/samples.js"), '  const durationBeats = state === "unknown"\n    ? 3\n    : state === "critical"\n      ? 1.25\n      : state === "healthy"\n        ? 2'),
              (Path("static/js/sonify/sampler.js"), 'unknown: Object.freeze({ drums: 0.22, bass: 0.3, bassLoop: 0, bassFilterHz: 620, lead: 0.42'),
              (Path("static/js/sonify/performance.js"), '    pad: [0.58, 0.3],'),
              (Path("static/js/sonify/samples.test.js"), '  const expectedLeadCounts = { healthy: 4, warning: 2, critical: 4, unknown: 2 };'),
          ]
          for path, anchor in checks:
              count = path.read_text(encoding="utf-8").count(anchor)
              print(f"{path}: {count}: {anchor[:72]}")
              if count != 1:
                  raise SystemExit(1)
          PY

          echo "DIAGNOSTIC PASSED THROUGH ALL PRE-PATCH STAGES"

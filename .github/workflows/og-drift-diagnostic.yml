name: Diagnose OG drift

on:
  pull_request:
    paths:
      - ".github/workflows/og-drift-diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-og-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out bounded repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: fix/regenerate-blackbox-og
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate and verify bounded OG repair
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          npm ci
          npm run og
          changed="$(git diff --name-only)"
          echo "Generated OG changes:"
          printf '%s\n' "$changed"
          test "$changed" = "og/blackbox.png"
          test "$(stat -c '%s' og/blackbox.png)" = "83476"
          test "$(sha256sum og/blackbox.png | cut -d' ' -f1)" = "68b03e5723b34dc67b30f8aaf39e520bcc8ab8c7f40c138aa646d32773f8e338"

      - name: Commit exact generated card to repair branch
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "og/blackbox.png"
          git config user.name "atlas-systems[bot]"
          git config user.email "atlas-systems@users.noreply.github.com"
          git add -- og/blackbox.png
          test "$(git diff --cached --name-only)" = "og/blackbox.png"
          git commit -m "fix: regenerate Blackbox social card"
          git push origin HEAD:fix/regenerate-blackbox-og

      - name: Upload regenerated Blackbox card
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: regenerated-blackbox-og
          path: og/blackbox.png
          if-no-files-found: error
          retention-days: 7

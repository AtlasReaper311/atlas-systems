name: System SYMPHONY featured leads experiment

on:
  push:
    branches:
      - feat/system-symphony-featured-leads
    paths:
      - .github/workflows/symphony-featured-leads-experiment.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/system-symphony-featured-leads
          fetch-depth: 0

      - name: Apply featured lead experiment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          samples = Path("static/js/sonify/samples.js")
          sampler = Path("static/js/sonify/sampler.js")
          tests = Path("static/js/sonify/samples.test.js")

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one anchor in {path}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(samples, '    grainSize: 0.14,\n    grainOverlap: 0.07,\n    stateCompatibility: Object.freeze(["healthy", "unknown"]),', '    grainSize: 0.22,\n    grainOverlap: 0.12,\n    stateCompatibility: Object.freeze(["healthy", "critical"]),')
          replace_once(samples, '    grainSize: 0.14,\n    grainOverlap: 0.07,\n    stateCompatibility: Object.freeze(["healthy"]),', '    grainSize: 0.22,\n    grainOverlap: 0.12,\n    stateCompatibility: Object.freeze(["unknown"]),')
          replace_once(samples, '    lead: Object.freeze(["acid-synth"]),\n    atmosphere: Object.freeze(["new-punks", null]),', '    lead: Object.freeze(["geneticist"]),\n    atmosphere: Object.freeze([null, "new-punks", null]),')
          replace_once(samples, '    lead: Object.freeze([]),\n    atmosphere: Object.freeze(["nanotech", "motherboard"]),', '    lead: Object.freeze(["geneticist"]),\n    atmosphere: Object.freeze(["nanotech", null, "motherboard", null]),')
          replace_once(samples, '    lead: Object.freeze([null, "geneticist"]),\n    atmosphere: Object.freeze([null]),', '    lead: Object.freeze(["no-alternative"]),\n    atmosphere: Object.freeze([null]),')
          replace_once(samples, '  critical: Object.freeze([]),', '  critical: Object.freeze([0, 8, 16, 24]),')
          replace_once(samples, '  const durationBeats = state === "unknown"\n    ? 2\n    : state === "critical"\n      ? 0.75\n      : section === "lift" || section === "fill"\n        ? 1\n        : 1.5;', '  const durationBeats = state === "unknown"\n    ? 3\n    : state === "critical"\n      ? 1.25\n      : state === "healthy"\n        ? 2\n        : section === "lift" || section === "fill"\n          ? 1\n          : 1.5;')
          replace_once(samples, '  const stateVelocity = state === "critical"\n    ? 0.68\n    : state === "warning"\n      ? 0.58\n      : state === "unknown"\n        ? 0.32\n        : 0.5;', '  const stateVelocity = state === "critical"\n    ? 0.64\n    : state === "warning"\n      ? 0.58\n      : state === "unknown"\n        ? 0.38\n        : 0.58;')

          replace_once(sampler, '  healthy: Object.freeze({ drums: 0.68, bass: 0.62, bassLoop: 0.32, bassFilterHz: 720, lead: 0.64, atmosphere: 0.2, atmosphereFilterHz: 2300, drive: 0.025, room: 0.08, delay: 0.12 }),', '  healthy: Object.freeze({ drums: 0.6, bass: 0.58, bassLoop: 0.28, bassFilterHz: 720, lead: 0.76, atmosphere: 0.12, atmosphereFilterHz: 2600, drive: 0.02, room: 0.06, delay: 0.18 }),')
          replace_once(sampler, '  critical: Object.freeze({ drums: 0.76, bass: 0.68, bassLoop: 0.28, bassFilterHz: 980, lead: 0, atmosphere: 0.1, atmosphereFilterHz: 920, drive: 0.065, room: 0.06, delay: 0.06 }),', '  critical: Object.freeze({ drums: 0.58, bass: 0.62, bassLoop: 0.24, bassFilterHz: 980, lead: 0.68, atmosphere: 0.07, atmosphereFilterHz: 1050, drive: 0.05, room: 0.05, delay: 0.14 }),')
          replace_once(sampler, '  unknown: Object.freeze({ drums: 0.28, bass: 0.34, bassLoop: 0, bassFilterHz: 620, lead: 0.2, atmosphere: 0, atmosphereFilterHz: 800, drive: 0.018, room: 0.16, delay: 0.18 }),', '  unknown: Object.freeze({ drums: 0.22, bass: 0.3, bassLoop: 0, bassFilterHz: 620, lead: 0.42, atmosphere: 0, atmosphereFilterHz: 800, drive: 0.014, room: 0.14, delay: 0.28 }),')

          replace_once(tests, '      if (state === "critical") assert.equal(id, null);\n      if (state === "unknown") unknownLeads.add(id);', '      if (state === "critical") assert.equal(id, "geneticist");\n      if (state === "unknown") unknownLeads.add(id);')
          replace_once(tests, '  assert.deepEqual(unknownLeads, new Set([null, "geneticist"]));', '  assert.deepEqual(unknownLeads, new Set(["no-alternative"]));')
          replace_once(tests, '  const expectedLeadCounts = { healthy: 4, warning: 2, critical: 0, unknown: 2 };', '  const expectedLeadCounts = { healthy: 4, warning: 2, critical: 4, unknown: 2 };')

          anchor = 'test("rhythmic bass loops are curated per state and exclude wobble and siren sources", () => {'
          extra = '''test("featured Demo leads do not replace the production live fallbacks", () => {\n  const live = { liveDirected: true };\n  assert.equal(resolveSamplePalette("healthy", live, 0).lead, "acid-synth");\n  assert.equal(resolveSamplePalette("warning", live, 0).lead, "acid-synth");\n  assert.equal(resolveSamplePalette("critical", live, 0).lead, null);\n  assert.equal(resolveSamplePalette("unknown", live, 0).lead, null);\n});\n\n'''
          text = tests.read_text(encoding="utf-8")
          if text.count(anchor) != 1:
              raise SystemExit("Expected test insertion anchor once")
          tests.write_text(text.replace(anchor, extra + anchor, 1), encoding="utf-8")
          PY

          node --check static/js/sonify/samples.js
          node --check static/js/sonify/sampler.js
          node --test static/js/sonify/samples.test.js static/js/sonify/sampler.test.js static/js/sonify/loop-recovery.test.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/sonify/samples.js
          git add static/js/sonify/sampler.js
          git add static/js/sonify/samples.test.js
          git commit -m "Experiment with featured System SYMPHONY lead identities"
          git push origin HEAD:feat/system-symphony-featured-leads

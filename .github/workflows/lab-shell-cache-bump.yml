name: Apply Lab shell cache bump

on:
  push:
    branches:
      - feat/system-map-atlas-field-card
    paths:
      - ".github/workflows/lab-shell-cache-bump.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/system-map-atlas-field-card
          fetch-depth: 0
      - name: Bump Lab shell reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("lab/index.html")
          content = path.read_text()
          old = "/lab/shared/shell.js?v=20260727-lab-fields-cache-v1"
          new = "/lab/shared/shell.js?v=20260727-lab-fields-cache-v2"
          if old not in content:
              raise SystemExit("expected cache-v1 Lab shell reference was not found")
          path.write_text(content.replace(old, new, 1))
          PY
      - name: Regenerate static performance baseline
        run: python3 scripts/measure_static_performance.py
      - name: Commit cache boundary update
        run: |
          rm .github/workflows/lab-shell-cache-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/index.html
          git add data/performance-baseline.json
          git add .github/workflows/lab-shell-cache-bump.yml
          git commit -m "Bump Lab shell cache boundary"
          git push origin HEAD:feat/system-map-atlas-field-card

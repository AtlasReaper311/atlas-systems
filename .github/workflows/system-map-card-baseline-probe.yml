name: System Map card baseline probe

on:
  pull_request:
    branches: [main]
    paths:
      - "static/js/card-signatures.js"
      - "static/css/card-signatures.css"
      - ".github/workflows/system-map-card-baseline-probe.yml"

permissions:
  contents: read

jobs:
  measure:
    name: Generate static performance candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Generate candidate
        run: python3 scripts/measure_static_performance.py
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-map-card-performance-candidate
          path: data/performance-baseline.json
          if-no-files-found: error
          retention-days: 1

name: Apply System SYMPHONY loop production v2

on:
  push:
    branches:
      - fix/system-symphony-cache-transition-coherence

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-system-symphony-loop-production-v2
  cancel-in-progress: true

jobs:
  patch-and-validate:
    name: Patch and validate loop production v2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out patch branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/system-symphony-cache-transition-coherence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check whether the production pass is already applied
        id: preflight
        run: |
          set -euo pipefail
          if grep -Fq 'export const ROOT_MIDI = 41; // F2' static/js/sonify/mapping.js; then
            echo "needs_patch=false" >>"${GITHUB_OUTPUT}"
            echo "Loop production v2 source changes are already present."
          else
            echo "needs_patch=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Normalize stale patcher assumptions
        if: steps.preflight.outputs.needs_patch == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_system_symphony_loop_production_v2.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          def one(label):
              matches = [index for index, line in enumerate(lines) if label in line]
              if len(matches) != 1:
                  raise SystemExit(f"expected one patcher target for {label}, found {len(matches)}")
              return matches[0]

          signature_index = one('"signature chord progression"')
          return_index = one('"return chord progression"')
          motif_index = one('"motif root retune"')

          lines[signature_index] = (
              "performance = replace_all(performance, "
              "'    chordOffset,\\n    bassPattern,', "
              "'    chordOffset,\\n    chordProgression,\\n    bassPattern,', "
              "\"signature and return chord progression\", minimum=2)"
          )
          lines[return_index] = "# chordProgression was inserted into both matching contexts above."
          lines[motif_index] = "# motif root is normalized against the current director source after patch application."
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Apply loop production v2 patch
        if: steps.preflight.outputs.needs_patch == 'true'
        run: python3 scripts/apply_system_symphony_loop_production_v2.py

      - name: Normalize current live audio policy
        if: steps.preflight.outputs.needs_patch == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          director_path = Path("static/js/sonify/composition-director.js")
          director = director_path.read_text(encoding="utf-8")
          old_root = 'const root = plan.state === "unknown" ? 50 : 54;'
          if old_root in director:
              director = director.replace(
                  old_root,
                  'const root = plan.state === "unknown" ? 53 : 57;',
                  1,
              )
          if 'const root = plan.state === "unknown" ? 53 : 57;' not in director:
              raise SystemExit("F-centred motif root was not established")
          director_path.write_text(director, encoding="utf-8")

          samples_path = Path("static/js/sonify/samples.js")
          samples = samples_path.read_text(encoding="utf-8")
          samples = samples.replace(
              'warning: Object.freeze({ bassLoop: "neo-tokyo", lead: "acid-synth", atmosphere: "motherboard" }),',
              'warning: Object.freeze({ bassLoop: "neo-tokyo", lead: "acid-synth", atmosphere: "new-punks" }),',
          )
          samples = samples.replace(
              'critical: Object.freeze({ bassLoop: "distorted-guitar", lead: null, atmosphere: "nanotech" }),',
              'critical: Object.freeze({ bassLoop: "distorted-guitar", lead: null, atmosphere: "new-punks" }),',
          )
          samples = samples.replace(
              'unknown: Object.freeze({ bassLoop: null, lead: "geneticist", atmosphere: null }),',
              'unknown: Object.freeze({ bassLoop: null, lead: null, atmosphere: null }),',
          )
          pattern = re.compile(
              r'  if \(performance\?\.liveDirected\) \{\n'
              r'(?:    .*\n)+?'
              r'  \}',
          )
          replacement = '''  if (performance?.liveDirected) {
            const fallback = LIVE_SAMPLE_FALLBACKS[state];
            palette.bassLoop = palette.bassLoop ?? fallback.bassLoop;
            palette.lead = fallback.lead;
            palette.atmosphere = fallback.atmosphere;
            palette.metal = "perc-stick";
          }'''
          samples, count = pattern.subn(replacement, samples, count=1)
          if count != 1:
              raise SystemExit(f"expected one live sample policy block, found {count}")
          samples_path.write_text(samples, encoding="utf-8")

          engine_path = Path("static/js/sonify/engine.js")
          engine = engine_path.read_text(encoding="utf-8")
          engine = engine.replace(
              'const depth = scoreState === "critical" ? 0.48 : scoreState === "warning" ? 0.54 : 0.6;',
              'const depth = scoreState === "critical" ? 0.62 : scoreState === "warning" ? 0.67 : 0.72;',
          )
          engine = engine.replace(
              'masterClipper = new Tone.Distortion({ distortion: 0.04, oversample: "2x", wet: 0.08 });',
              'masterClipper = new Tone.Distortion({ distortion: 0.04, oversample: "2x", wet: 0.03 });',
          )
          engine_path.write_text(engine, encoding="utf-8")
          PY

      - name: Validate touched JavaScript syntax
        if: steps.preflight.outputs.needs_patch == 'true'
        run: |
          set -euo pipefail
          node --check static/js/sonify/mapping.js
          node --check static/js/sonify/samples.js
          node --check static/js/sonify/sampler.js
          node --check static/js/sonify/seed-dimensions.js
          node --check static/js/sonify/performance.js
          node --check static/js/sonify/composition-director.js
          node --check static/js/sonify/engine.js
          node --check static/js/sonify/ui.js

      - name: Validate static site and System SYMPHONY
        if: steps.preflight.outputs.needs_patch == 'true'
        run: |
          set -euo pipefail
          npx --yes html-validate@9.7.1 "**/*.html"
          node --test js/tests/*.test.mjs lab/tests/*.test.mjs static/js/sonify/*.test.js
          python3 scripts/generate_sitemap.py --check-only
          python3 scripts/verify_pages_output.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY
          git diff --check

      - name: Commit validated source changes
        if: steps.preflight.outputs.needs_patch == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _headers
          git add lab/index.html
          git add static/audio/system-symphony/AUDIT.md
          git add static/css/system-symphony.css
          git add static/js/sonify/mapping.js
          git add static/js/sonify/mapping.test.js
          git add static/js/sonify/samples.js
          git add static/js/sonify/sampler.js
          git add static/js/sonify/seed-dimensions.js
          git add static/js/sonify/performance.js
          git add static/js/sonify/composition-director.js
          git add static/js/sonify/engine.js
          git add static/js/sonify/engine.test.js
          git add static/js/sonify/composition-integration.test.js
          git add static/js/sonify/coherence-cache.test.js
          git add static/js/sonify/loop-production-v2.test.js
          git add static/js/sonify/ui.js
          git diff --cached --check
          git commit -m "feat: rebuild System SYMPHONY around phrase loops"
          git push origin HEAD:fix/system-symphony-cache-transition-coherence

name: Apply published article head metadata refresh

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-published-article-head-refresh.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-published-article-head-refresh
  cancel-in-progress: false

jobs:
  apply:
    name: Generate head-only article refresh
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/public-interface-shell-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out stacked site branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          repository: AtlasReaper311/atlas-systems
          ref: fix/published-article-head-metadata-v1
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Check out scheduler migration authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          repository: AtlasReaper311/atlas-scheduler
          ref: feat/article-interface-refresh-v1
          token: ${{ secrets.GENERATOR_TOKEN }}
          path: .head-refresh-scheduler
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: "3.12"

      - name: Generate isolated refreshed site
        run: |
          set -euo pipefail
          python .head-refresh-scheduler/scripts/refresh_published_article_heads.py \
            --site-dir . \
            --output-dir "${RUNNER_TEMP}/refreshed-site" \
            --report-out "${RUNNER_TEMP}/article-head-refresh-report.json" \
            --slug sonin-generative-system \
            --slug slampunk-dynamic-mix-engine \
            --slug ramone-local-ai-system \
            --slug overclocking-specular-core

      - name: Copy allowlisted outputs only
        run: |
          set -euo pipefail
          for slug in \
            sonin-generative-system \
            slampunk-dynamic-mix-engine \
            ramone-local-ai-system \
            overclocking-specular-core
          do
            cp "${RUNNER_TEMP}/refreshed-site/writing/${slug}/index.html" "writing/${slug}/index.html"
          done
          mkdir -p docs/evidence
          cp "${RUNNER_TEMP}/article-head-refresh-report.json" docs/evidence/published-article-head-refresh-v1.json
          rm -rf .head-refresh-scheduler

      - name: Verify surgical diff
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("docs/evidence/published-article-head-refresh-v1.json").read_text(encoding="utf-8"))
          if report["schema"] != "atlas-scheduler/published-article-head-refresh/v1":
              raise SystemExit("unexpected refresh report schema")
          if report["production_write"] is not False:
              raise SystemExit("refresh report must remain non-production")
          if len(report["articles"]) != 4:
              raise SystemExit("expected four refreshed articles")
          for article in report["articles"]:
              if not article["body_unchanged"]:
                  raise SystemExit(f"body changed for {article['slug']}")
              if article["body_sha256_before"] != article["body_sha256_after"]:
                  raise SystemExit(f"body hash mismatch for {article['slug']}")
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/evidence/published-article-head-refresh-v1.json \
            writing/overclocking-specular-core/index.html \
            writing/ramone-local-ai-system/index.html \
            writing/slampunk-dynamic-mix-engine/index.html \
            writing/sonin-generative-system/index.html | sort)"
          test "${changed}" = "${expected}"

      - name: Commit generated metadata refresh
        run: |
          set -euo pipefail
          git config user.name "atlas-scheduler[bot]"
          git config user.email "atlas-scheduler@users.noreply.github.com"
          git add \
            docs/evidence/published-article-head-refresh-v1.json \
            writing/sonin-generative-system/index.html \
            writing/slampunk-dynamic-mix-engine/index.html \
            writing/ramone-local-ai-system/index.html \
            writing/overclocking-specular-core/index.html
          git commit -m "fix: refresh published article head metadata"
          git push origin HEAD:fix/published-article-head-metadata-v1

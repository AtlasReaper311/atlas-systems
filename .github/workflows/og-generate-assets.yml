name: Generate estate social preview assets

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/og/**"
      - "package.json"
      - "package-lock.json"
      - "static/vendor/atlas-interface/v0.2.0/fonts/**"
      - "lab/**/index.html"
      - ".github/workflows/og-generate-assets.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-og-assets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate deterministic social preview assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned generator dependencies
        run: npm ci

      - name: Generate, wire, and verify every card
        run: npm run og

      - name: Run focused generator tests
        run: node --test scripts/og/*.test.mjs

      - name: Prove existing cards remain byte-identical
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            og/home.png \
            og/work.png \
            og/writing.png \
            og/lab.png \
            og/systems.png \
            og/about.png \
            og/system-map.png \
            og/console.png \
            og/overclocking-specular-core.png \
            og/ramone-local-ai-system.png \
            og/slampunk-dynamic-mix-engine.png \
            og/sonin-generative-system.png

      - name: Commit generated files to the approved pull request branch
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/estate-social-preview-completion'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- og
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { loadManifest, resolveRoutes } from "./scripts/og/routes.mjs";

          const htmlFiles = resolveRoutes(loadManifest()).map((entry) => entry.html);
          execFileSync("git", ["add", "--", ...htmlFiles], { stdio: "inherit" });
          NODE
          if git diff --cached --quiet; then
            echo "Generated files already match the branch"
            exit 0
          fi
          git commit -m "chore: generate estate social preview assets [skip ci]"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Stage generated files for review
        if: always()
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/social-preview-output
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_ROOT}/repo"
          cp -R og "${OUTPUT_ROOT}/repo/og"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { loadManifest, resolveRoutes } from "./scripts/og/routes.mjs";

          const outputRoot = process.env.OUTPUT_ROOT;
          for (const entry of resolveRoutes(loadManifest())) {
            const destination = path.join(outputRoot, "repo", entry.html);
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.copyFileSync(entry.html, destination);
          }
          NODE
          git diff --binary HEAD^ HEAD > "${OUTPUT_ROOT}/generated-social-previews.patch" || true
          git show --name-status --format= HEAD > "${OUTPUT_ROOT}/generated-files.txt"

      - name: Upload generated source and images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: estate-social-preview-generated-output
          path: ${{ runner.temp }}/social-preview-output
          if-no-files-found: error
          retention-days: 3

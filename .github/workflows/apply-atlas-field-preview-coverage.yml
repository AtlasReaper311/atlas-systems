name: Apply AtlasField runtime asset identity

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/apply-atlas-field-preview-coverage.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/homepage-field-deploy-diagnostic
          fetch-depth: 0

      - name: Publish a fresh AtlasField runtime identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "20260727-atlas-field-production-v1"
          new = "20260727-atlas-field-production-v2"
          paths = [
              Path("index.html"),
              Path("static/js/homepage-interactions.js"),
              Path("static/js/live/homepage-truth.js"),
              Path("scripts/smoke_homepage_atlas_field_production.mjs"),
              Path("js/tests/homepage-entrypoint-cache.test.mjs"),
              Path("js/tests/homepage-field.test.mjs"),
          ]
          for path in paths:
              source = path.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"missing AtlasField v1 identity in {path}")
              path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Commit runtime identity
        run: |
          git config user.name "Atlas Systems Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git add static/js/homepage-interactions.js
          git add static/js/live/homepage-truth.js
          git add scripts/smoke_homepage_atlas_field_production.mjs
          git add js/tests/homepage-entrypoint-cache.test.mjs
          git add js/tests/homepage-field.test.mjs
          git commit -m "Publish repaired AtlasField runtime identity"
          git push origin HEAD:fix/homepage-field-deploy-diagnostic

name: System Map card field preview smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".github/workflows/system-map-card-field-preview-smoke.yml"
      - "_headers"
      - "lab/shared/shell.js"
      - "lab/shared/system-map-card-field.css"
      - "lab/shared/system-map-card-field.js"
      - "static/js/atlas-field.js"
      - "scripts/smoke_system_map_card_field_preview.mjs"
      - "js/tests/system-map-card-field.test.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-system-map-card-field-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'interface-preview-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://interface-pr-${{ github.event.pull_request.number }}.atlas-systems-44t.pages.dev
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SYSTEM_MAP_FIELD_OUTPUT_DIR: ${{ runner.temp }}/system-map-card-field-preview-smoke
    steps:
      - name: Check out smoke runner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            scripts/smoke_system_map_card_field_preview.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"

      - name: Wait for governed preview identity
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "${PREVIEW_URL}/lab/shared/system-map-card-field.js?v=20260727-system-map-card-field-v1" | grep --quiet "atlas-system-map-featured-card-v1"; then
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: governed preview did not expose the expected System Map card field identity" >&2
          exit 1

      - name: Install pinned browser tooling
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/system-map-card-field-runner"
          cp scripts/smoke_system_map_card_field_preview.mjs "${RUNNER_TEMP}/system-map-card-field-runner/"
          cd "${RUNNER_TEMP}/system-map-card-field-runner"
          npm init -y >/dev/null
          npm install --save-exact playwright@1.61.1
          npm audit --audit-level=high
          ./node_modules/.bin/playwright install --with-deps firefox

      - name: Verify visible System Map card field pixels
        working-directory: ${{ runner.temp }}/system-map-card-field-runner
        run: node smoke_system_map_card_field_preview.mjs

      - name: Upload System Map card field evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: system-map-card-field-preview-smoke
          path: |
            ${{ runner.temp }}/system-map-card-field-preview-smoke/evidence.json
            ${{ runner.temp }}/system-map-card-field-preview-smoke/system-map-card-field-preview.png
          if-no-files-found: error
          retention-days: 14

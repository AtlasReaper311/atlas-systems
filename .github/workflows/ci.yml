name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-homepage-tests:
    name: Discover homepage regression tests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          show-progress: false

      - name: Build test matrix
        id: tests
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          excluded = {
              "live-registry-esm.test.mjs",
              "live-signal-ownership.test.mjs",
          }
          tests = [
              str(path)
              for path in sorted(Path("js/tests").glob("*.test.mjs"))
              if path.name not in excluded
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tests={json.dumps(tests)}\n")
          PY

  homepage-regression-tests:
    name: Homepage regression ${{ matrix.test }}
    needs: discover-homepage-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-homepage-tests.outputs.tests) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run regression test
        run: node --test "${{ matrix.test }}"

  discover-lab-tests:
    name: Discover Lab regression tests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          show-progress: false

      - name: Build test matrix
        id: tests
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tests = [str(path) for path in sorted(Path("lab/tests").glob("*.test.mjs"))]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tests={json.dumps(tests)}\n")
          PY

  lab-regression-tests:
    name: Lab regression ${{ matrix.test }}
    needs: discover-lab-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-lab-tests.outputs.tests) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run regression test
        run: node --test "${{ matrix.test }}"

  static-validation:
    name: Static site validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check README style
        run: |
          test -s README.md
          grep -q "ATLAS SYSTEMS //" README.md
          grep -q "## How it fits into Atlas Systems" README.md
          grep -q "Part of \[atlas-systems.uk\](https://atlas-systems.uk)" README.md
          grep -q "labelColor=0a0a0f" README.md

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate HTML
        run: npx --yes html-validate@9.7.1 "**/*.html"

      - name: Test live registry ES module contract
        run: node --test js/tests/live-registry-esm.test.mjs

      - name: Test homepage live-signal ownership
        run: node --test js/tests/live-signal-ownership.test.mjs

      - name: Run System Symphony tests
        run: node --test static/js/sonify/*.test.js

      - name: Validate sitemap
        run: python3 scripts/generate_sitemap.py --check-only

      - name: Verify Pages output
        run: python3 scripts/verify_pages_output.py .

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Check repository links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments --root-dir ${{ github.workspace }} ."
          fail: true

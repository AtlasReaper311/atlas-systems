name: Pull request CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static site validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check README style
        run: |
          test -s README.md
          grep -q "ATLAS SYSTEMS //" README.md
          grep -q "## How it fits into Atlas Systems" README.md
          grep -q "Part of \[atlas-systems.uk\](https://atlas-systems.uk)" README.md
          grep -q "labelColor=0a0a0f" README.md

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate HTML
        run: npx --yes html-validate@9.7.1 "**/*.html"

      - name: Run public interface tests
        run: node --test js/tests/public-interface-contract.test.mjs

      - name: Run existing main-site tests
        id: main-site
        continue-on-error: true
        run: |
          set -o pipefail
          files=()
          for path in js/tests/*.test.mjs; do
            if [ "${path}" != "js/tests/public-interface-contract.test.mjs" ]; then
              files+=("${path}")
            fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            node --test --test-concurrency=1 "${files[@]}" 2>&1 | tee main-site-test-report.txt
          else
            printf '%s\n' 'No additional main-site tests found.' | tee main-site-test-report.txt
          fi

      - name: Upload main-site test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-site-test-report
          path: main-site-test-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce main-site test result
        if: steps.main-site.outcome != 'success'
        run: |
          cat main-site-test-report.txt
          exit 1

      - name: Run Lab tests
        id: lab
        continue-on-error: true
        run: |
          set -o pipefail
          node --test lab/tests/*.test.mjs 2>&1 | tee lab-test-report.txt

      - name: Upload Lab test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-test-report
          path: lab-test-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Lab test result
        if: steps.lab.outcome != 'success'
        run: |
          cat lab-test-report.txt
          exit 1

      - name: Run System SYMPHONY tests
        id: system-symphony
        continue-on-error: true
        run: |
          set -o pipefail
          node --test static/js/sonify/*.test.js 2>&1 | tee system-symphony-test-report.txt

      - name: Upload System SYMPHONY test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-symphony-test-report
          path: system-symphony-test-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce System SYMPHONY test result
        if: steps.system-symphony.outcome != 'success'
        run: |
          cat system-symphony-test-report.txt
          exit 1

      - name: Check normalized page titles
        run: |
          set -euo pipefail
          python3 scripts/normalize_page_titles.py
          git diff --exit-code -- '*.html'

      - name: Validate sitemap
        run: python3 scripts/generate_sitemap.py --check-only

      - name: Validate static performance baseline
        run: python3 scripts/measure_static_performance.py --check-only

      - name: Validate Pages output
        run: python3 scripts/verify_pages_output.py .

      - name: Validate filtered Pages publish artifact
        run: |
          set -euo pipefail
          publish_directory="${RUNNER_TEMP}/pages-publish"
          bash scripts/prepare_pages_publish.sh "${publish_directory}"
          python3 scripts/verify_pages_output.py "${publish_directory}"

      - name: Validate route social previews
        run: |
          node --test scripts/og/*.test.mjs
          node scripts/og/verify.mjs

      - name: Parse committed JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Check repository links offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --include-fragments --root-dir ${{ github.workspace }} ."
          fail: true

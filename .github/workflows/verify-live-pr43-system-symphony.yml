name: Verify live PR43 System Symphony mix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-verify-live-pr43-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live:
    name: Verify live audio build and palette
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"

      - name: Install pinned browser tooling
        run: npm install --no-save --no-package-lock playwright@1.61.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify live System Symphony
        env:
          VERIFICATION_OUTPUT_DIR: ${{ runner.temp }}/live-pr43-system-symphony
        run: node .github/scripts/verify-live-pr43-system-symphony.mjs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: live-pr43-system-symphony
          path: ${{ runner.temp }}/live-pr43-system-symphony
          if-no-files-found: error
          retention-days: 7

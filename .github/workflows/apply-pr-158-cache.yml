name: Apply PR 158 cache correction

on:
  push:
    branches:
      - feat/system-symphony-trace-board

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'chore: activate PR 158 cache correction' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and validate cache correction
        shell: bash
        run: |
          set -eu

          TARGET_BRANCH='feat/system-symphony-trace-board'
          EXPECTED_HEAD="${GITHUB_SHA}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/helpers/fix_pr_158_cache.py

          node --test \
            js/tests/batch-h-system-symphony-page.test.mjs \
            js/tests/system-symphony-navigation-ia.test.mjs \
            js/tests/system-symphony-phase-d-role-routing.test.mjs \
            js/tests/system-symphony-trace-board-contract.test.mjs \
            js/tests/system-symphony-trace-board-cache-contract.test.mjs \
            static/js/sonify/coherence-cache.test.js
          git diff --check

          rm .github/helpers/fix_pr_158_cache.py
          rm .github/workflows/apply-pr-158-cache.yml
          git add -A
          git commit -m 'Fix System Symphony trace-board cache identities'
          NEW_HEAD="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" \
            origin \
            "${NEW_HEAD}:refs/heads/${TARGET_BRANCH}"

          git push origin --delete ops/cache-report-pr-158-20260728 || true
          git push origin --delete ops/fix-pr-158-cache-20260728 || true
          git push origin --delete ops/apply-pr-158-cache-20260728-v2 || true
